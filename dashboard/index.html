<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Autobot</title><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{--bg:#030a11;--surface:#07111b;--surface-2:#08141f;--line:#183042;--line-soft:#102433;--cyan:#00e7f4;--cyan-bright:#12f2ff;--green:#00e879;--red:#ff5363;--text:#f0f5fb;--muted:#91a9c0;--muted-2:#b4c6d8}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -25%,rgba(0,219,240,.11),transparent 48%),linear-gradient(180deg,#020910,#040b12 70%);color:var(--text);font:14px Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.005em}
body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(rgba(34,211,238,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(34,211,238,.018) 1px,transparent 1px);background-size:40px 40px}
#login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}#login h1,.brand{font:900 30px Orbitron,sans-serif;letter-spacing:4px;color:var(--cyan);margin:0}
input,button{font:inherit}#login input{padding:12px;border:1px solid var(--line);border-radius:8px;background:#07111b;color:var(--cyan);text-align:center;letter-spacing:8px}button{cursor:pointer}
#app{display:none;max-width:1240px;margin:auto;padding:0 24px 42px}
.topbar{height:76px;display:flex;align-items:center;justify-content:space-between;gap:24px;border-bottom:1px solid var(--line-soft);margin-bottom:22px}
.brand-lockup{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-decoration:none;min-width:0}.brand{font-size:27px;letter-spacing:3px;text-shadow:0 0 18px rgba(0,231,244,.22)}.brand-caption{color:var(--muted-2);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;white-space:nowrap}
.nav{height:100%;display:flex;align-items:stretch;gap:28px}.nav a{display:flex;align-items:center;padding:2px 0 0;color:var(--muted-2);text-decoration:none;border-bottom:2px solid transparent;font-size:14px;font-weight:600;transition:color .16s,border-color .16s}.nav a.active,.nav a:hover{color:var(--cyan);border-color:var(--cyan)}
.header-right{display:flex;align-items:center;gap:12px}.muted{color:var(--muted)}.button{background:transparent;border:1px solid var(--cyan);border-radius:8px;color:var(--cyan);padding:9px 16px;font-weight:700}.button:hover{background:rgba(0,231,244,.08)}.button:disabled{opacity:.5}
.research-heading,.trading-heading{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin:0 0 18px}.research-heading h1,.trading-heading h1{font-size:28px;line-height:1.15;letter-spacing:-.025em;color:var(--text);margin:0}.research-heading p,.trading-heading p{color:var(--muted);font-size:14px;margin:7px 0 0;line-height:1.5}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}.tile,.card{background:linear-gradient(155deg,rgba(7,18,29,.98),rgba(4,12,20,.98));border:1px solid rgba(30,61,80,.86);border-radius:11px;box-shadow:0 8px 26px rgba(0,0,0,.12)}.tile{padding:14px 16px;min-height:94px}.label{font-size:10px;color:var(--muted-2);letter-spacing:.8px;text-transform:uppercase}.value{font-weight:700;font-variant-numeric:tabular-nums;font-size:23px;line-height:1.15;margin-top:7px;overflow-wrap:anywhere}.cyan{color:var(--cyan)}.green{color:var(--green)}.red{color:var(--red)}
.card{padding:17px 16px;margin-bottom:13px}.champ-head{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:flex-start}.champ-head h2,.card h2{font-size:20px;letter-spacing:-.02em;margin:0}.meta{color:var(--muted);font-size:12px;margin-top:5px;overflow-wrap:anywhere}.objective{color:var(--muted);font-size:12px;line-height:1.5;margin-top:6px}.metrics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:16px 0 12px;padding:0 0 13px;border-bottom:1px solid var(--line-soft);color:var(--muted-2)}.metrics span{display:flex;flex-direction:column;gap:4px;white-space:normal;font-size:12px}.metrics strong{font-weight:500;color:var(--muted)}.metrics span span{font-size:17px;font-weight:650;color:var(--text);font-variant-numeric:tabular-nums}.metrics .metric-cyan span{color:var(--cyan)}.metrics .metric-red span{color:var(--red)}
.template-badge{display:inline-flex;align-items:center;border:1px solid var(--cyan);border-radius:999px;color:var(--cyan);font-size:10px;font-weight:750;letter-spacing:.6px;padding:4px 9px}.research-badge{border-color:var(--green);color:var(--green)}
.chart{position:relative;border:1px solid var(--line-soft);border-radius:8px;background:linear-gradient(180deg,rgba(4,13,21,.65),rgba(2,9,15,.8));margin-top:8px;padding:8px}.chart svg{display:block;width:100%;height:auto;max-height:260px}.chart-hitarea{cursor:crosshair;outline:none}.chart-hitarea:focus{stroke:var(--cyan);stroke-width:1}.chart-tooltip{position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}
.empty{padding:25px 12px;text-align:center;color:var(--muted);line-height:1.6}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line-soft);overflow-wrap:anywhere}.table th{font-size:10px;color:var(--muted);font-weight:500;letter-spacing:.45px}.table tbody tr:hover{background:rgba(0,231,244,.035)}.table .champ-row{background:rgba(0,231,244,.045)}.research-table{margin-top:0}.research-table h3{font-size:17px;margin:0 0 3px}.research-table .meta{margin:0 0 10px}.research-table .button{font-size:12px;text-decoration:none}
.research-table-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:10px}.champion-layout{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}.audit-details{color:var(--muted);font-size:11px;margin-top:8px}.audit-details summary{cursor:pointer}.audit-details code{overflow-wrap:anywhere}
.lane-tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:16px 0 13px}.lane-tabs button{min-width:0;border:1px solid var(--line);background:rgba(5,15,24,.78);color:var(--muted-2);padding:8px 5px;border-radius:9px;font-size:12px;white-space:nowrap}.lane-tabs button.active{border-color:var(--cyan);background:linear-gradient(90deg,#00dbe9,#08c6d8);color:#001017;font-weight:700;box-shadow:0 0 18px rgba(0,231,244,.13)}
.lane-content{border:0;border-radius:0;background:transparent;padding:0;color:var(--muted);font-size:12px;line-height:1.45}.template-title{display:flex;align-items:center;justify-content:space-between;gap:12px}.template-title h2{font-size:19px}.template-heading{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.template-badge.paper{border-color:#e7c600;color:#ffe000}.example-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:0}.example-chart{height:128px;display:grid;place-items:center;position:relative;border:1px solid var(--line-soft);border-radius:7px;background-color:#030b12;background-image:linear-gradient(rgba(25,63,82,.35) 1px,transparent 1px),linear-gradient(90deg,rgba(25,63,82,.35) 1px,transparent 1px);background-size:25% 25%;color:var(--muted);text-align:center;padding:20px}.example-chart:after{content:"";position:absolute;inset:auto 0 24px;border-bottom:1px solid rgba(0,231,244,.18)}.example-chart span{z-index:1;background:#050d15;padding:8px 12px;border-radius:5px}.example-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-top:10px}.example-metric{border:1px solid var(--line-soft);border-radius:7px;padding:9px 11px;background:rgba(3,11,18,.55)}.example-metric .label{font-size:9px}.example-metric .value{font-size:17px;margin-top:6px}.example-metric .objective{font-size:11px}
.empty-state{padding:26px 20px;text-align:center;min-height:260px;display:flex;flex-direction:column;justify-content:center;align-items:center}.empty-state h2{font-size:18px;margin:0 0 8px}.empty-state p{max-width:470px;margin:0 auto 15px;color:var(--muted);line-height:1.55}.empty-state .button{display:inline-block;text-decoration:none;padding:9px 18px}.lock-icon{width:70px;height:70px;margin:0 auto 14px;position:relative;border:1px solid rgba(65,106,138,.35);border-radius:50%;background:rgba(18,39,57,.46);color:#91a9c0}.lock-icon:before{content:"";position:absolute;width:15px;height:14px;left:26px;top:19px;border:2px solid #91a9c0;border-bottom:0;border-radius:10px 10px 0 0}.lock-icon:after{content:"";position:absolute;width:20px;height:17px;left:23px;top:31px;border:2px solid #91a9c0;border-radius:3px;background:#102235}.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-left:8px;vertical-align:middle;box-shadow:0 0 10px rgba(0,232,121,.6)}.value.status-text{font-size:16px;line-height:1.25;overflow-wrap:normal}
@media(max-width:900px){#app{padding:0 18px 36px}}
@media(max-width:620px){#app{padding:0 14px 28px}.topbar{height:auto;min-height:72px;gap:10px;flex-wrap:wrap;padding:12px 0}.brand{font-size:22px}.brand-caption{font-size:9px;letter-spacing:.9px}.nav{height:35px;gap:20px}.nav a{font-size:13px}.tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.tile{padding:12px;min-height:86px}.value{font-size:20px}.card{padding:14px 12px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.example-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.research-heading h1,.trading-heading h1{font-size:25px}.lane-tabs{gap:4px}.lane-tabs button{font-size:10px;padding:8px 3px}.example-chart{height:145px}.table th,.table td{padding:8px 5px;font-size:11px}.empty-state{min-height:230px}}

.last-updated,.updated-note{text-align:right;color:var(--muted);font-size:11px;line-height:1.55;padding-top:3px}.champion-title{display:flex;align-items:center;gap:12px}.champion-name{font-size:16px;margin-top:10px;color:var(--text)}.champ-head{align-items:center}.metrics{grid-template-columns:repeat(5,minmax(0,1fr))}.research-table .empty{padding:14px}.chart-unavailable{height:180px;display:grid;place-items:center;position:relative;color:var(--muted);font-size:13px}.chart-unavailable-grid{position:absolute;inset:12px;background-image:linear-gradient(rgba(25,63,82,.30) 1px,transparent 1px),linear-gradient(90deg,rgba(25,63,82,.30) 1px,transparent 1px);background-size:20% 25%;border-bottom:1px solid rgba(25,63,82,.5)}.chart-unavailable span{z-index:1;background:#06101a;padding:8px 13px}.template-inner{margin-top:13px;padding:14px;border:1px solid rgba(30,61,80,.75);border-radius:9px;background:rgba(3,11,18,.42)}.template-heading h3{font-size:17px;margin:0}.template-heading{margin-bottom:10px}.research-table-head{align-items:center}.trading-heading{display:block}
@media(max-width:620px){.research-heading{gap:12px}.last-updated{display:none}.champ-head{align-items:flex-start}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.template-inner{padding:11px}.updated-note{display:none}}
</style></head><body>
<div id="login"><h1>AUTOBOT</h1><div class="muted">Secure dashboard access</div><input type="password" id="code" maxlength="6" placeholder="••••••"><button class="button" onclick="doLogin()">ACCESS</button><span id="login-error" class="error"></span></div>
<div id="app"><header class="topbar"><a class="brand-lockup" href="/" aria-label="Autobot Growth Research"><span class="brand">AUTOBOT</span><span class="brand-caption">Growth Research</span></a><nav class="nav" aria-label="Primary"><a href="/research" data-route="research">Research</a><a href="/trading" data-route="trading">Trading</a></nav></header><main id="view"></main></div>
<script>
const BASE='__AUTOBOT_BASE_PATH__',KEY='autobot_token';let TOKEN=localStorage.getItem(KEY),route='research',research=null,trading=null,requestGeneration=0,activeRequest=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,options={}){const requestToken=TOKEN;const r=await fetch(BASE+path,{...options,headers:{'Content-Type':'application/json',...(requestToken?{Authorization:'Bearer '+requestToken}:{}),...(options.headers||{})}});if(r.status===401&&TOKEN===requestToken){localStorage.removeItem(KEY);TOKEN=null;document.getElementById('app').style.display='none';document.getElementById('login').style.display='flex';}return r}
async function doLogin(){const r=await api('/api/auth',{method:'POST',body:JSON.stringify({code:document.getElementById('code').value})});if(!r.ok){document.getElementById('login-error').textContent='Access denied';return}TOKEN=(await r.json()).token;localStorage.setItem(KEY,TOKEN);showApp();loadRoute()}
document.getElementById('code').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
function showApp(){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block'}
function currentRoute(){return location.pathname.endsWith('/trading')?'trading':'research'}
function navigate(next){const url=BASE+(next==='trading'?'/trading':'/research');history.pushState({},'',url);loadRoute(next)}
document.querySelector('.brand').href=BASE+'/';document.querySelectorAll('.nav a').forEach(a=>a.href=BASE+'/'+a.dataset.route);
document.querySelectorAll('.nav a').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();navigate(a.dataset.route)}));window.addEventListener('popstate',()=>{route=currentRoute();loadRoute()});
const money=v=>{if(v==null)return '—';const number=Number(v);if(!Number.isFinite(number))return '—';return number!==0&&(Math.abs(number)<1||Math.abs(number)>=1e15)?'$'+number.toExponential(2):number.toLocaleString('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0})};
const pct=v=>v==null?'—':(Number(v)*100).toFixed(2)+'%';const ratio=v=>v==null?'—':Number(v).toFixed(2);
const equityNumber=value=>{if(typeof value==='number')return Number.isFinite(value)&&value>0?value:null;if(typeof value!=='string'||! /^[+-]?(?:[0-9]+(?:\.[0-9]*)?|\.[0-9]+)(?:[eE][+-]?[0-9]+)?(?![\s\S])/.test(value))return null;const number=Number(value);return Number.isFinite(number)&&number>0?number:null};
function chartPoint(svg,index){
 const points=JSON.parse(svg.getAttribute("data-points")||"[]");
 if(!points.length)return;
 const i=Math.max(0,Math.min(points.length-1,index)),point=points[i],group=svg.parentNode.querySelector(".chart-inspection");
 if(!group)return;
 const crosshair=group.querySelector(".chart-crosshair"),marker=group.querySelector(".chart-point"),background=group.querySelector(".chart-tip-bg");
 crosshair.setAttribute("x1",point.x);crosshair.setAttribute("x2",point.x);
 marker.setAttribute("cx",point.x);marker.setAttribute("cy",point.y===null?16:point.y);marker.setAttribute("visibility",point.y===null?"hidden":"visible");
 const tipX=point.x>500?point.x-246:point.x+8;background.setAttribute("x",tipX);
 group.querySelector(".chart-tip-date").setAttribute("x",tipX+8);group.querySelector(".chart-tip-date").textContent=point.date;
 const value=point.equity===null?"Equity unavailable (missing mark)":(point.equity!==0&&(Math.abs(point.equity)<1||Math.abs(point.equity)>=1e15)?"$"+point.equity.toExponential(2):point.equity.toLocaleString("en-US",{style:"currency",currency:"USD",maximumFractionDigits:2}));
 group.querySelector(".chart-tip-equity").setAttribute("x",tipX+8);group.querySelector(".chart-tip-equity").textContent=value;
 group.setAttribute("visibility","visible");svg.setAttribute("data-index",String(i));svg.setAttribute("aria-valuenow",String(i));svg.setAttribute("aria-valuetext",`${point.date}, ${value}`);
 const live=svg.parentNode.querySelector(".chart-tooltip");if(live){live.textContent=`${point.date} · ${value}`;live.hidden=false}
}
function chartPointer(event,svg){const box=svg.ownerSVGElement.getBoundingClientRect(),x=(event.clientX-box.left)/box.width*960;const points=JSON.parse(svg.getAttribute("data-points")||"[]");chartPoint(svg,Math.round((x-78)/(960-78-18)*(points.length-1)))}
function chartLeave(svg){if(document.activeElement!==svg){const group=svg.parentNode.querySelector(".chart-inspection");if(group)group.setAttribute("visibility","hidden");const live=svg.parentNode.querySelector(".chart-tooltip");if(live)live.hidden=true}}
function chartKey(event,svg){if(!["ArrowLeft","ArrowRight","Home","End"].includes(event.key))return;event.preventDefault();const points=JSON.parse(svg.getAttribute("data-points")||"[]"),current=Number(svg.getAttribute("data-index"))||0;chartPoint(svg,event.key==="Home"?0:event.key==="End"?points.length-1:current+(event.key==="ArrowRight"?1:-1))}
function chart(data){
 if(data?.availability!=='available'||!data.points?.length)return '<div class="chart chart-unavailable"><div class="chart-unavailable-grid" aria-hidden="true"></div><span>Verified champion equity curve unavailable</span></div>';
 const cutoff=/^\d{4}-\d{2}-\d{2}$/.test(data.development_end||"")?data.development_end:null;
 const points=data.points.filter(point=>typeof point?.date==="string"&&(!cutoff||point.date<=cutoff));
 if(!points.length)return '<div class="chart chart-unavailable"><div class="chart-unavailable-grid" aria-hidden="true"></div><span>Verified champion equity curve unavailable</span></div>';
 const equities=points.map(point=>equityNumber(point.equity)),valid=equities.map(value=>value!==null);
 const marks=equities.filter(value=>value!==null);
 if(marks.length<2)return '<div class="chart chart-unavailable"><div class="chart-unavailable-grid" aria-hidden="true"></div><span>Verified champion equity curve unavailable</span></div>';
 const w=960,h=250,left=78,right=18,top=16,bottom=36,plotH=h-top-bottom,lo=Math.min(...marks),hi=Math.max(...marks),logLo=Math.log10(lo),logHi=Math.log10(hi),logSpan=logHi-logLo||.04,minLog=Math.log10(Number.MIN_VALUE),maxLog=Math.log10(Number.MAX_VALUE),low=Math.max(minLog,logLo-logSpan*.05),high=Math.min(maxLog,logHi+logSpan*.05),range=high-low;
 const x=i=>left+i/(points.length-1)*(w-left-right),y=value=>top+(high-Math.log10(value))/range*plotH;
 const ticks=Array.from({length:5},(_,i)=>10**(high-i*range/4)).filter(value=>Number.isFinite(value)&&value>0);
 const grid=ticks.map(value=>{const yy=top+(high-Math.log10(value))/range*plotH;return `<line x1="${left}" y1="${yy}" x2="${w-right}" y2="${yy}" stroke="#22293a"/><text data-axis-value="${value}" x="${left-8}" y="${yy+4}" text-anchor="end" fill="#92a1b8" font-size="11">${esc(money(value))}</text>`}).join('');
 const segments=[];let segment=[];points.forEach((point,i)=>{if(valid[i])segment.push(`${x(i)},${y(equities[i])}`);else if(segment.length){segments.push(segment);segment=[]}});if(segment.length)segments.push(segment);
 const paths=segments.filter(segment=>segment.length>1).map(segment=>{const first=segment[0].split(',')[0],last=segment[segment.length-1].split(',')[0];return `<polygon points="${first},${top+plotH} ${segment.join(' ')} ${last},${top+plotH}" fill="url(#equity-fill)"/><polyline fill="none" stroke="#00e7f4" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" points="${segment.join(' ')}"/>`}).join('');
 const interactionPoints=points.map((point,i)=>({x:x(i),y:valid[i]?y(equities[i]):null,date:point.date,equity:valid[i]?equities[i]:null}));
 const tooltipId=`chart-tooltip-${data.replay?'replay':'history'}`;
 const hitArea=`<rect class="chart-hitarea" x="${left}" y="${top}" width="${w-left-right}" height="${plotH}" fill="transparent" tabindex="0" role="slider" aria-valuemin="0" aria-valuemax="${points.length-1}" aria-valuenow="0" aria-label="Inspect chart data points. Use left and right arrow keys to move between dates." aria-describedby="${tooltipId}" data-index="0" data-points="${esc(JSON.stringify(interactionPoints))}" onpointermove="chartPointer(event,this)" onpointerleave="chartLeave(this)" onkeydown="chartKey(event,this)" onfocus="chartPoint(this,Number(this.getAttribute('data-index'))||0)"/>`;
 const inspection=`<g class="chart-inspection" visibility="hidden" pointer-events="none"><line class="chart-crosshair" x1="${left}" x2="${left}" y1="${top}" y2="${top+plotH}" stroke="#e8f3f8" stroke-dasharray="4 4"/><circle class="chart-point" cx="${left}" cy="${top}" r="4" fill="#22d3ee" stroke="#e8f3f8"/><rect class="chart-tip-bg" x="${left+8}" y="${top+5}" width="230" height="38" rx="4" fill="#0d1420" stroke="#22d3ee"/><text class="chart-tip-date" x="${left+16}" y="${top+20}" fill="#e8f3f8" font-size="11"></text><text class="chart-tip-equity" x="${left+16}" y="${top+35}" fill="#22d3ee" font-size="11"></text></g>`;
 const gapText=data.gap_count?`${data.gap_count} missing mark${data.gap_count===1?'':'s'} shown as gaps; no data is invented or smoothed.`:'No missing marks.';
  return `<div class="objective">${data.replay?'Five-year historical replay':'Verified historical equity'} · ${esc(data.development_start)} through ${esc(data.development_end)}. Starting equity comes from the first verified numeric mark; ending equity: ${esc(money(data.ending_equity))}. ${esc(gapText)}${data.replay?' Hypothetical result; not a forecast or live performance.':' The chart uses verified historical marks through the development cutoff.'}</div><div class="chart"><svg viewBox="0 0 ${w} ${h}" role="group" aria-label="${data.replay?'Five-year hypothetical replay':'Verified historical champion equity'} on a positive logarithmic scale with gaps at missing marks"><defs><linearGradient id="equity-fill" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#00ddeb" stop-opacity=".38"/><stop offset="100%" stop-color="#00ddeb" stop-opacity=".015"/></linearGradient></defs><text x="${left}" y="12" fill="#92a1b8" font-size="11">Equity (USD · log scale)</text>${grid}${paths}${inspection}${hitArea}<text x="${left}" y="${h-8}" fill="#92a1b8" font-size="11">${esc(points[0].date)}</text><text x="${w-right}" y="${h-8}" text-anchor="end" fill="#92a1b8" font-size="11">${esc(points[points.length-1].date)}</text></svg><div id="${tooltipId}" class="chart-tooltip" role="tooltip" aria-live="polite" hidden></div></div>`
}
function fiveYearReplay(data,championCutoff){
 const unavailable='<article class="card"><h2>Five-year historical replay</h2><div class="empty">Unavailable: verified champion equity marks do not cover a complete five-year development window.</div></article>';
 if(data?.availability!=="available"||!Array.isArray(data.points)||data.development_end!==championCutoff||!/^\d{4}-\d{2}-\d{2}$/.test(championCutoff||""))return unavailable;
 const cutoff=new Date(`${championCutoff}T00:00:00Z`);
 if(!Number.isFinite(cutoff.getTime())||cutoff.toISOString().slice(0,10)!==championCutoff)return unavailable;
 const start=new Date(cutoff);start.setUTCFullYear(start.getUTCFullYear()-5);
 const startDate=start.toISOString().slice(0,10),latestStart=new Date(start);latestStart.setUTCDate(latestStart.getUTCDate()+31);
 const earliestEnd=new Date(cutoff);earliestEnd.setUTCDate(earliestEnd.getUTCDate()-7);
 // Date-filter before touching equity: post-cutoff values are never read or rendered.
 const bounded=data.points.filter(point=>typeof point?.date==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(point.date)&&point.date<=championCutoff&&point.date>=startDate);
 const verified=bounded.map(point=>({date:point.date,equity:equityNumber(point.equity)}));
 const marks=verified.filter(point=>point.equity!==null);
 if(marks.length<2||marks[0].date>latestStart.toISOString().slice(0,10)||marks[marks.length-1].date<earliestEnd.toISOString().slice(0,10))return unavailable;
 const base=marks[0].equity,rebased=verified.map(point=>({date:point.date,equity:point.equity===null?null:10000*(point.equity/base)}));
 const ending=marks[marks.length-1].equity/base*10000;
 const replay={...data,availability:"available",development_start:marks[0].date,development_end:marks[marks.length-1].date,ending_equity:ending,gap_count:rebased.filter(point=>point.equity===null).length,points:rebased,replay:true};
 return `<article class="card"><h2>Five-year historical replay of $10,000</h2><div class="objective">Historical modeled results are not guarantees or live performance. Window anchored to the champion development cutoff ${esc(championCutoff)}; plotted verified marks run ${esc(marks[0].date)} through ${esc(marks[marks.length-1].date)}. Rebased from the first verified equity mark ($10,000 starting value) to a hypothetical ending value of ${esc(money(ending))}. Missing marks remain gaps; no forward-fill, interpolation, or fabricated points.</div>${chart(replay)}</article>`
}
const LANE_STAGES=[["historical","Historical"],["modeled","Modeled"],["paper","Paper"],["trivial_capital","Trivial Capital"],["live","Live"]];let laneStageSelection="historical";
function renderLaneStage(stage){return `<div class="lane-content" role="tabpanel"><strong>${esc(LANE_STAGES.find(([key])=>key===stage)?.[1]||"Historical")}:</strong> Illustrative template only. No verified ${esc(stage)} data is available.</div>`}
function renderTemplate(){return `<article class="card template-card"><div class="template-title"><div><h2>Example Strategy Component</h2><div class="meta">How a promoted strategy will appear</div></div><span class="template-badge">TEMPLATE</span></div><section class="template-inner"><div class="template-heading"><h3>Growth example</h3><span class="template-badge paper">● Illustrative</span></div><div class="lane-tabs" role="tablist" aria-label="Example strategy lifecycle">${LANE_STAGES.map(([key,label])=>`<button type="button" role="tab" aria-selected="${laneStageSelection===key}" class="${laneStageSelection===key?'active':''}" onclick="selectLaneStage('${key}')">${label}</button>`).join('')}</div>${renderLaneStage(laneStageSelection)}<div class="example-chart" role="img" aria-label="Illustrative chart area; verified historical data unavailable"><span>Verified historical series unavailable<br>— no data plotted —</span></div><div class="example-metrics">${[['Annual return','—','Unavailable: no verified return series'],['Sharpe','—','Unavailable: no verified risk metric'],['Max Drawdown','—','Unavailable: no verified drawdown'],['Ending Equity','—','Unavailable: no verified equity']].map(([label,value,note])=>`<div class="example-metric"><div class="label">${label}</div><div class="value">${value}</div><div class="objective">${note}</div></div>`).join('')}</div><p class="objective">Illustrative component only. No strategy, order activity, or performance claims are represented.</p></section></article>`}
function renderTrading(data){const lanes=Array.isArray(data?.lanes)?data.lanes:[];const count=lanes.length;const statuses=[["Strategies",String(count),count?"Verified canonical lane count":"No canonical promoted lanes"],["Capital","—","Unavailable: no verified capital value"],["Total Return","—","Unavailable: no verified return value"],["System",count?"Status unavailable":"Awaiting promotion",count?"No verified system state":"No canonical promoted lanes"]];return `<section class="trading-heading"><h1>Trading</h1><p>Live and paper activity is shown only when backed by canonical promoted-lane data.</p></section><section class="tiles">${statuses.map(([label,value,note])=>`<div class="tile"><div class="label">${label}</div><div class="value ${label==='System'&&!count?'cyan status-text':''}">${esc(value)}</div><div class="objective">${esc(note)}</div></div>`).join('')}</section>${count?lanes.map(lane=>`<article class="card"><h2>${esc(lane.display_name)}</h2><div class="meta">${esc(lane.lane_id)}</div><div class="objective">Promoted lane record. Stage-specific status is only shown when present in verified data.</div></article>`).join(''):`<article class="card empty-state"><div class="lock-icon" aria-hidden="true"></div><h2>No Active Strategies</h2><p>There are no canonical promoted strategies available for trading. Research results are not active strategies and are not trading performance.</p><a class="button" href="${BASE}/research" onclick="event.preventDefault();navigate('research')">Go to Research →</a></article>`}${renderTemplate()}`}
function selectLaneStage(stage){if(!LANE_STAGES.some(([key])=>key===stage))return;laneStageSelection=stage;document.getElementById('view').innerHTML=renderTrading(trading||{lanes:[]})}
function renderRouteError(name,message){return `<article class="card empty error" role="status"><h2>${name} unavailable</h2><p>${esc(message)}</p></article>`}
async function loadRoute(target=currentRoute()){if(!TOKEN)return;route=target==='trading'?'trading':'research';const requestRoute=route,generation=++requestGeneration;if(activeRequest)activeRequest.abort();const controller=new AbortController();activeRequest=controller;document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('active',a.dataset.route===requestRoute));try{const endpoint=requestRoute==='trading'?'/api/dashboard/trading':'/api/dashboard/research';const response=await api(endpoint,{signal:controller.signal});if(!response.ok)throw Error(`Request failed (${response.status})`);const data=await response.json();if(generation!==requestGeneration)return;if(requestRoute==='trading'){trading=data;document.getElementById('view').innerHTML=renderTrading(data)}else{research=data;document.getElementById('view').innerHTML=renderResearch(data)}}catch(e){if(generation===requestGeneration&&e.name!=='AbortError'&&TOKEN)document.getElementById('view').innerHTML=renderRouteError(requestRoute==='trading'?'Trading':'Research',e.message)}finally{if(generation===requestGeneration)activeRequest=null}}
if(TOKEN){showApp();route=currentRoute();loadRoute(route)}setInterval(()=>{if(TOKEN)loadRoute(currentRoute())},120000);
function experimentDate(id){const m=/^(\d{4})(\d{2})(\d{2})_/.exec(String(id??""));if(!m)return"—";const year=Number(m[1]),month=Number(m[2]),day=Number(m[3]),date=new Date(Date.UTC(year,month-1,day));if(date.getUTCFullYear()!==year||date.getUTCMonth()!==month-1||date.getUTCDate()!==day)return"—";return date.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric",timeZone:"UTC"})}
function renderResearch(data){
  const c=data.champion,n=data.counts||{},a=data.activity||{},recent=Array.isArray(data.recent)?data.recent.slice(0,5):[];
  const state=a.state==='active'?'OK':(a.state||'unknown').toUpperCase(),running=a.state==='active';
  const rows=recent.length?recent.map(r=>`<tr class="${c&&r.experiment_id===c.experiment_id?'champ-row':''}"><td>${c&&r.experiment_id===c.experiment_id?'★ ':''}${esc(r.experiment_id)}</td><td>${esc(experimentDate(r.experiment_id))}</td><td class="${c&&r.experiment_id===c.experiment_id?'cyan':''}">${esc(pct(r.development_annual_return))}</td></tr>`).join(''):'<tr><td colspan="3" class="empty">No recent experiments.</td></tr>';
  const range=c?`${esc(c.development_start)} through ${esc(c.development_end)}`:'—';
  const experimentTable=`<article class="card research-table"><div class="research-table-head"><div><h3>Recent Experiments</h3><div class="meta">Latest results from the research lab</div></div><span class="objective">Standard Annual return</span></div><table class="table"><thead><tr><th>ID</th><th>Date</th><th>Annual return</th></tr></thead><tbody>${rows}</tbody></table></article>`;
  return `<section class="research-heading"><div><h1>Research</h1><p>AI-driven strategy discovery for long-term wealth.</p></div>${a.updated_at?`<div class="last-updated">Last updated<br>${esc(a.updated_at)}</div>`:''}</section>
  <section class="tiles">
   <div class="tile"><div class="label">System</div><div class="value ${running?'green':''}">${esc(state)}${running?'<span class="status-dot" aria-hidden="true"></span>':''}</div><div class="objective">${running?'Research running':a.state==='sleeping'?'Research sleeping':'Status unavailable'}</div></div>
   <div class="tile"><div class="label">Objective</div><div class="value cyan">Annual return</div><div class="objective">Standard compounded annual growth</div></div>
   <div class="tile"><div class="label">Best Annual return</div><div class="value green">${c?esc(pct(c.annual_return)):'—'}</div><div class="objective">${c?'Current champion':'No champion available'}</div></div>
   <div class="tile"><div class="label">Experiments</div><div class="value">${esc(n.valid_attempts??0)}</div><div class="objective">Valid research attempts</div></div>
  </section>
  <article class="card champion-card"><div class="champ-head"><div><div class="champion-title"><h2>Current Champion</h2><span class="template-badge research-badge">RESEARCH</span></div><div class="champion-name">${c?esc(c.experiment_id):'No verified champion data available'}</div><div class="meta">${c?esc(String(c.candidate_sha256??'').slice(0,12)):'Development results appear here when available'}</div></div>${c?`<div class="updated-note">Development window<br>${range}</div>`:''}</div>
   <div class="metrics"><span><strong>Annual return</strong><span>${c?esc(pct(c.annual_return)):'—'}</span></span><span><strong>Sharpe</strong><span>${c?esc(ratio(c.sharpe)):'—'}</span></span><span class="metric-red"><strong>Max Drawdown</strong><span>${c?esc(pct(c.max_drawdown)):'—'}</span></span><span><strong>Ending Equity</strong><span>${c?esc(money(c.ending_equity)):'—'}</span></span><span class="metric-cyan"><strong>Data Window</strong><span>${c?esc(c.development_end):'—'}</span></span></div>
   ${chart(data.chart||{})}
   ${c?`<details class="audit-details"><summary>Champion audit identity</summary><div>Candidate SHA-256: <code>${esc(c.candidate_sha256)}</code> · Dataset manifest SHA-256: <code>${esc(c.dataset_manifest_sha256)}</code></div></details><details class="audit-details"><summary>Five-year historical replay</summary>${fiveYearReplay(data.chart,c.development_end)}</details>`:''}</article>
  ${experimentTable}`
 }
