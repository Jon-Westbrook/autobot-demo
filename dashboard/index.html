<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autobot</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23090B12'/%3E%3Ctext x='16' y='24' font-family='sans-serif' font-weight='900' font-size='24' fill='%2300F0FF' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#090b12;--panel:#10131d;--line:#22293a;--line-soft:rgba(34,41,58,.65);--cyan:#00f0ff;--green:#00ff88;--yellow:#f0e000;--red:#ff5c7a;--text:#e8eef7;--muted:#92a1b8;--gray:#a7b3c8}
html{background:var(--bg)}
body{background:radial-gradient(circle at top,rgba(0,240,255,.08),transparent 35%),linear-gradient(180deg,#090b12,#07090e);color:var(--text);font-family:'Courier New',monospace;min-height:100vh}
body:before{content:'';position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(0,240,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,240,255,.03) 1px,transparent 1px);background-size:40px 40px;opacity:.45}
#login{display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:18px}
#login h1{font-family:'Orbitron',sans-serif;color:var(--cyan);font-size:38px;letter-spacing:6px;text-shadow:0 0 26px rgba(0,240,255,.35)}
#login .boot{color:var(--muted);font-size:12px;letter-spacing:2px;text-transform:uppercase}
#login input{background:#0e1118;border:1px solid var(--cyan);color:var(--cyan);padding:14px 28px;width:min(320px,82vw);font-size:20px;font-family:'Courier New',monospace;text-align:center;letter-spacing:10px;outline:none}
#login button{background:transparent;border:1px solid var(--cyan);color:var(--cyan);padding:10px 28px;cursor:pointer;font-family:'Orbitron',sans-serif;font-size:13px;letter-spacing:2px}
#login button:hover{background:rgba(0,240,255,.08)}
#login .err{min-height:18px;color:var(--red);font-size:13px}
#app{display:none;max-width:1320px;margin:0 auto;padding:24px 20px 60px;position:relative;z-index:1}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:24px;border-bottom:1px solid var(--line);padding-bottom:18px}
header h1{font-family:'Orbitron',sans-serif;font-size:34px;color:var(--cyan);letter-spacing:5px;text-shadow:0 0 26px rgba(0,240,255,.22)}
.sub{color:var(--muted);font-size:12px;letter-spacing:2px;text-transform:uppercase;margin-top:6px}
.header-actions{display:flex;align-items:center;gap:14px}
.last-updated{font-size:12px;color:var(--muted)}
.refresh-btn{background:transparent;border:1px solid var(--cyan);color:var(--cyan);padding:8px 18px;cursor:pointer;font-family:'Orbitron',sans-serif;font-size:12px;letter-spacing:2px}
.refresh-btn[disabled]{opacity:.65;cursor:wait}
.overview{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:22px}
.overview-card,.strategy-card,.panel{background:linear-gradient(180deg,rgba(16,19,29,.95),rgba(9,11,18,.96));border:1px solid rgba(34,41,58,.8);border-radius:12px}
.overview-card{padding:18px}
.overview-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-bottom:10px}
.overview-value{font-family:'Orbitron',sans-serif;font-size:28px;overflow-wrap:anywhere}
.overview-value.ok{color:var(--green)}
.overview-value.degraded{color:var(--yellow)}
.overview-value.error{color:var(--red)}
.overview-value.cyan{color:var(--cyan)}
.overview-note{font-size:11px;color:var(--muted);margin-top:8px}
.lifecycle{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;border-bottom:1px solid var(--line-soft);padding-bottom:16px}
.life-btn{background:transparent;border:1px solid var(--line);color:var(--muted);padding:10px 16px;border-radius:999px;cursor:pointer;font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;display:inline-flex;align-items:center;gap:9px}
.life-btn:hover{border-color:var(--gray);color:var(--text)}
.life-btn.active{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 22px rgba(0,240,255,.1)}
.life-btn .dot{width:7px;height:7px;border-radius:999px;background:currentColor;flex:none}
.life-btn.state-active .dot{background:var(--green)}
.life-btn.state-empty .dot{background:rgba(146,161,184,.5)}
.life-arrow{align-self:center;color:rgba(146,161,184,.45);font-size:13px}
.strategy-card{padding:20px;display:grid;gap:18px}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.card-title h2{font-family:'Orbitron',sans-serif;font-size:22px;color:var(--text);letter-spacing:2px}
.card-title .meta{color:var(--muted);font-size:12px;margin-top:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{display:inline-block;padding:6px 12px;border-radius:999px;font-size:11px;font-family:'Orbitron',sans-serif;letter-spacing:1px;text-transform:uppercase;border:1px solid var(--line)}
.badge.ok{border-color:var(--green);color:var(--green)}
.badge.degraded{border-color:var(--yellow);color:var(--yellow)}
.badge.error{border-color:var(--red);color:var(--red)}
.badge.idle{border-color:var(--line);color:var(--muted)}
.badge.cyan{border-color:var(--cyan);color:var(--cyan)}
.status-dot{display:inline-flex;align-items:center;gap:7px;font-size:12px;text-transform:lowercase;color:var(--muted)}
.status-dot:before{content:'';display:inline-block;width:7px;height:7px;border-radius:999px;background:currentColor;flex:none}
.status-dot.ok{color:var(--green)}
.status-dot.degraded{color:var(--yellow)}
.status-dot.error{color:var(--red)}
.card-summary{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;color:var(--muted)}
.card-summary strong{color:var(--text)}
.summary-chip{display:inline-flex;gap:6px;align-items:baseline}
.summary-chip .good{color:var(--green)}
.summary-chip .bad{color:var(--red)}
.panel{padding:16px}
.panel h3,.section-title{font-family:'Orbitron',sans-serif;font-size:12px;color:var(--cyan);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px}
.objective-line{font-size:14px;line-height:1.6;color:var(--text)}
.objective-line code{color:var(--cyan);font-size:13px}
.chart-panel{padding:16px 16px 14px}
.chart-head{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;gap:16px;margin-bottom:12px}
.chart-subtitle{color:var(--muted);font-size:12px}
.chart-tabs,.series-toggles,.scale-toggles{display:flex;flex-wrap:wrap;gap:8px}
.toggle-btn,.scale-btn{background:transparent;border:1px solid var(--line);color:var(--muted);padding:8px 12px;border-radius:999px;cursor:pointer;font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:1px;text-transform:uppercase}
.toggle-btn.active{border-color:var(--series-color,var(--cyan));color:var(--series-color,var(--cyan))}
.scale-btn.active{border-color:var(--cyan);color:var(--cyan)}
.series-toggles{margin-bottom:10px}
.chart-wrap{position:relative;width:100%;overflow:hidden;border:1px solid var(--line-soft);border-radius:12px;background:rgba(0,0,0,.16)}
.chart-svg{display:block;width:100%;height:auto}
.chart-overlay{cursor:crosshair}
.chart-hover-guide{pointer-events:none;transition:opacity .12s ease}
.chart-tooltip{position:fixed;z-index:50;min-width:180px;max-width:280px;padding:10px 12px;border:1px solid rgba(34,41,58,.9);border-radius:10px;background:rgba(9,11,18,.95);box-shadow:0 12px 28px rgba(0,0,0,.35);font-size:12px;line-height:1.5;color:var(--text);pointer-events:none;opacity:0;transition:opacity .12s ease}
.chart-tooltip.visible{opacity:1}
.chart-tooltip-date{display:block;color:var(--muted);margin-bottom:6px;font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:1px}
.chart-tooltip-line{display:flex;justify-content:space-between;gap:14px;align-items:baseline}
.chart-tooltip-label{color:var(--muted);font-size:11px}
.chart-tooltip-value{color:var(--text);font-variant-numeric:tabular-nums}
.chart-empty{padding:18px;color:var(--muted);font-size:13px}
.dashboard-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:240px;gap:14px;font-family:'Orbitron',sans-serif;color:var(--cyan);text-transform:uppercase;letter-spacing:6px}
.dashboard-loading .loading-title{font-size:16px}
.dashboard-loading .loading-bar{position:relative;width:240px;height:4px;border:1px solid rgba(0,240,255,.35);border-radius:2px;overflow:hidden;background:rgba(0,240,255,.06)}
.dashboard-loading .loading-bar::after{content:"";position:absolute;top:0;bottom:0;width:40%;background:linear-gradient(90deg,transparent,var(--cyan),transparent);animation:loadingScan 1.4s ease-in-out infinite}
.dashboard-loading .loading-hint{font-size:10px;color:var(--muted);letter-spacing:3px}
@keyframes loadingScan{0%{left:-40%}100%{left:100%}}
.panel-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);column-gap:18px;row-gap:10px;font-size:13px;line-height:1.5}
.kv dt{color:var(--muted);font-size:12px;white-space:nowrap}
.kv dd{color:var(--text);text-align:right;min-width:0;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.kv-empty{color:var(--muted);opacity:.5}
.details-shell{border:1px solid var(--line-soft);border-radius:12px;background:rgba(0,0,0,.14);margin-top:18px}
.details-shell summary{cursor:pointer;padding:12px 14px;font-family:'Orbitron',sans-serif;font-size:11px;color:var(--cyan);letter-spacing:2px;text-transform:uppercase}
.details-body{padding:0 14px 14px;display:grid;gap:12px}
.runs-table{width:100%;border-collapse:collapse;font-size:13px}
.runs-table th,.runs-table td{padding:9px 8px;border-bottom:1px solid rgba(34,41,58,.7);text-align:left;vertical-align:top}
.runs-table th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px}
.runs-table td{color:var(--text);font-variant-numeric:tabular-nums}
.runs-table td.keep{color:var(--green)}
.runs-table td.explore{color:var(--cyan)}
.runs-table td.discard{color:var(--muted)}
.runs-table td.fail{color:var(--red)}
.muted{color:var(--muted)}
.empty-state{padding:34px 22px;text-align:center;display:grid;gap:12px;justify-items:center}
.empty-state .glyph{font-family:'Orbitron',sans-serif;font-size:13px;letter-spacing:5px;color:var(--cyan);opacity:.7;border:1px dashed rgba(0,240,255,.3);border-radius:999px;padding:10px 20px}
.empty-state h2{font-family:'Orbitron',sans-serif;font-size:20px;letter-spacing:3px;color:var(--text)}
.empty-state p{color:var(--muted);font-size:13px;line-height:1.7;max-width:620px}
.empty-state .blocked{color:var(--yellow);font-size:12px;letter-spacing:1px;text-transform:uppercase}
.reserved-note{border:1px solid rgba(240,224,0,.35);border-radius:10px;padding:12px 14px;color:var(--yellow);font-size:12px;line-height:1.6;background:rgba(240,224,0,.04)}
.spark{display:block;width:100%;height:auto}
.deps{display:flex;gap:8px;flex-wrap:wrap}
.dep{border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:11px;letter-spacing:1px;color:var(--gray)}
.dep.signal{border-color:rgba(0,240,255,.45);color:var(--cyan)}
.dep.target{border-color:rgba(0,255,136,.45);color:var(--green)}
.money-up{color:var(--green)}
.money-down{color:var(--red)}
.loading-pulse{animation:loadingPulse .85s ease-in-out infinite alternate}
@keyframes loadingPulse{from{opacity:.55}to{opacity:1}}
@media (max-width:720px){
  header h1{font-size:28px;letter-spacing:4px}
  .card-summary{flex-direction:column;gap:8px}
  .chart-head{grid-template-columns:minmax(0,1fr)}
  .life-arrow{display:none}
  .runs-table th:nth-child(4),.runs-table td:nth-child(4){display:none}
}
</style>
</head>
<body>

<div id="login">
  <h1>AUTOBOT</h1>
  <div class="boot">growth // sector research</div>
  <input type="password" id="code-input" maxlength="6" placeholder="••••••" autofocus>
  <button onclick="doLogin()">ACCESS</button>
  <div class="err" id="login-err"></div>
</div>

<div id="app">
  <header>
    <div>
      <h1>AUTOBOT</h1>
      <div class="sub" id="header-sub">Growth sector research</div>
    </div>
    <div class="header-actions">
      <span class="last-updated" id="last-ts"></span>
      <button class="refresh-btn" onclick="loadDashboard()">REFRESH</button>
    </div>
  </header>

  <section class="overview" id="overview"></section>
  <nav class="lifecycle" id="lifecycle"></nav>
  <section id="stage-view"></section>
  <details class="details-shell" id="foundation-shell">
    <summary>Canonical foundation</summary>
    <div class="details-body" id="foundation"></div>
  </details>
</div>

<script>
const APP_BASE_PATH = '/autobot';
const TOKEN_KEY = 'autobot_token';
const CHART_ID = 'research';
let TOKEN = localStorage.getItem(TOKEN_KEY);
let DASHBOARD = null;
let isLoading = false;
let activeStage = 'research';
const chartState = {visible: null, scale: 'log', render: null};

function api(path, opts = {}) {
  const headers = {'Content-Type': 'application/json'};
  if (TOKEN) headers.Authorization = 'Bearer ' + TOKEN;
  return fetch(APP_BASE_PATH + path, {...opts, headers: {...headers, ...(opts.headers || {})}})
    .then(response => {
      if (response.status === 401) {
        localStorage.removeItem(TOKEN_KEY);
        TOKEN = null;
        location.reload();
      }
      return response;
    });
}

async function doLogin() {
  const code = document.getElementById('code-input').value;
  const response = await api('/api/auth', {method: 'POST', body: JSON.stringify({code})});
  if (!response.ok) {
    document.getElementById('login-err').textContent = 'Nope.';
    return;
  }
  const data = await response.json();
  TOKEN = data.token;
  localStorage.setItem(TOKEN_KEY, TOKEN);
  showApp();
  loadDashboard();
}

document.getElementById('code-input').addEventListener('keydown', event => {
  if (event.key === 'Enter') doLogin();
});

function showApp() {
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'block';
}

if (TOKEN) showApp();

// --------------------------------------------------------------------- formatting

function escHtml(value) {
  return String(value === null || value === undefined ? '' : value)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function fmtTs(value) {
  if (!value) return '—';
  try {
    return new Date(value).toLocaleString('en-US', {
      timeZone: 'America/New_York', month: 'short', day: 'numeric',
      hour: 'numeric', minute: '2-digit', hour12: true,
    }) + ' ET';
  } catch { return value; }
}

function fmtShortDate(value) {
  if (!value) return '—';
  try {
    return new Date(value + 'T00:00:00').toLocaleDateString('en-US', {
      timeZone: 'America/New_York', month: 'short', day: 'numeric', year: 'numeric',
    });
  } catch { return value; }
}

function fmtMoney(value) {
  if (value === null || value === undefined) return '—';
  return Number(value).toLocaleString('en-US',
    {style: 'currency', currency: 'USD', maximumFractionDigits: 0});
}

function fmtRatio(value, digits = 2) {
  if (value === null || value === undefined || value === '') return '—';
  const number = Number(value);
  return Number.isFinite(number) ? number.toFixed(digits) : '—';
}

function fmtPctOf(value, digits = 2) {
  if (value === null || value === undefined || value === '') return '—';
  const number = Number(value);
  if (!Number.isFinite(number)) return '—';
  return (number * 100).toFixed(digits) + '%';
}

function fmtInt(value) {
  if (value === null || value === undefined || value === '') return '—';
  const number = Number(value);
  return Number.isFinite(number) ? number.toLocaleString('en-US') : escHtml(value);
}

function signClass(value) {
  if (value === null || value === undefined) return '';
  return Number(value) >= 0 ? 'money-up' : 'money-down';
}

function kv(rows) {
  const body = rows.filter(Boolean).map(([label, value]) =>
    `<dt>${escHtml(label)}</dt><dd>${value === null || value === undefined || value === ''
      ? '<span class="kv-empty">—</span>' : value}</dd>`).join('');
  return `<dl class="kv">${body}</dl>`;
}

function csv(value) {
  if (!value) return null;
  const list = Array.isArray(value) ? value : String(value).split(',');
  return list.filter(Boolean).join(', ');
}

// --------------------------------------------------------------------- chart engine

function ensureChartState(chart) {
  if (!chartState.visible) {
    chartState.visible = {};
    for (const item of (chart.series || [])) {
      chartState.visible[item.key] = Boolean(item.default_visible);
    }
  }
  return chartState;
}

function toggleSeries(key) {
  if (!chartState.visible) return;
  chartState.visible[key] = !chartState.visible[key];
  renderStage();
}

function setScale(scale) {
  chartState.scale = scale;
  renderStage();
}

function ensureTooltipHost() {
  let tooltip = document.getElementById(`tooltip-${CHART_ID}`);
  if (!tooltip) {
    tooltip = document.createElement('div');
    tooltip.id = `tooltip-${CHART_ID}`;
    tooltip.className = 'chart-tooltip';
    document.body.appendChild(tooltip);
  }
  return tooltip;
}

function handleChartMove(event) {
  const state = chartState.render;
  if (!state || !state.points.length) return;
  const {points, visibleSeries, width, height, left, right, top, bottom} = state;
  const svg = event.currentTarget.ownerSVGElement;
  const rect = svg.getBoundingClientRect();
  const scaleX = rect.width / width;
  const scaleY = rect.height / height;
  const localX = Math.max(left, Math.min(width - right, (event.clientX - rect.left) / scaleX));
  const localY = Math.max(top, Math.min(height - bottom, (event.clientY - rect.top) / scaleY));
  const ratio = points.length === 1 ? 0 : (localX - left) / (width - left - right);
  const index = Math.max(0, Math.min(points.length - 1, Math.round(ratio * (points.length - 1))));
  const point = points[index];
  const x = points.length === 1
    ? left + ((width - left - right) / 2)
    : left + (index / (points.length - 1)) * (width - left - right);

  const line = document.getElementById(`hover-line-${CHART_ID}`);
  if (line) {
    line.setAttribute('x1', x); line.setAttribute('x2', x);
    line.setAttribute('y1', top); line.setAttribute('y2', height - bottom);
    line.setAttribute('opacity', '1');
  }
  const hLine = document.getElementById(`hover-hline-${CHART_ID}`);
  if (hLine) {
    hLine.setAttribute('x1', left); hLine.setAttribute('x2', width - right);
    hLine.setAttribute('y1', localY); hLine.setAttribute('y2', localY);
    hLine.setAttribute('opacity', '1');
  }

  const tooltip = ensureTooltipHost();
  if (state.lastTooltipIndex !== index) {
    const lines = visibleSeries.map(item => {
      const value = point[item.key];
      if (value === null || value === undefined) return '';
      return `<span class="chart-tooltip-line">`
        + `<span class="chart-tooltip-label" style="color:${escHtml(item.color)}">${escHtml(item.label)}</span>`
        + `<span class="chart-tooltip-value">${escHtml(fmtMoney(value))}</span></span>`;
    }).filter(Boolean).join('');
    tooltip.innerHTML = `<span class="chart-tooltip-date">${escHtml(fmtShortDate(point.date))}</span>${lines}`;
    state.lastTooltipIndex = index;
  }
  tooltip.classList.add('visible');
  const margin = 12;
  const offset = 14;
  const tooltipWidth = tooltip.offsetWidth || 220;
  const tooltipHeight = tooltip.offsetHeight || 110;
  const anchorX = rect.left + (x * scaleX);
  const anchorY = rect.top + (localY * scaleY);
  let tooltipLeft = anchorX + offset;
  if (tooltipLeft + tooltipWidth > window.innerWidth - margin) {
    tooltipLeft = anchorX - tooltipWidth - offset;
  }
  tooltip.style.left = `${Math.max(margin, Math.min(tooltipLeft, window.innerWidth - tooltipWidth - margin))}px`;
  let topPx = anchorY - tooltipHeight - offset;
  if (topPx < margin) topPx = anchorY + offset;
  tooltip.style.top = `${Math.max(margin, Math.min(topPx, window.innerHeight - tooltipHeight - margin))}px`;
}

function handleChartLeave() {
  if (chartState.render) chartState.render.lastTooltipIndex = null;
  for (const id of [`hover-line-${CHART_ID}`, `hover-hline-${CHART_ID}`]) {
    const node = document.getElementById(id);
    if (node) node.setAttribute('opacity', '0');
  }
  const tooltip = document.getElementById(`tooltip-${CHART_ID}`);
  if (tooltip) tooltip.classList.remove('visible');
}

function buildChartSvg(chart) {
  const points = chart.points || [];
  if (!points.length) return '<div class="chart-empty">No curve has been published yet.</div>';
  const visibleSeries = (chart.series || []).filter(item => chartState.visible[item.key]);
  if (!visibleSeries.length) return '<div class="chart-empty">Select at least one series.</div>';

  const values = [];
  for (const point of points) {
    for (const item of visibleSeries) {
      const value = point[item.key];
      if (value !== null && value !== undefined && Number(value) > 0) values.push(Number(value));
    }
  }
  if (!values.length) return '<div class="chart-empty">No visible data for the selected series.</div>';

  let minValue = Math.min(...values);
  let maxValue = Math.max(...values);
  if (minValue === maxValue) { minValue *= 0.98; maxValue *= 1.02; }

  const width = 960, height = 300, left = 62, right = 18, top = 18, bottom = 42;
  const plotWidth = width - left - right;
  const plotHeight = height - top - bottom;
  const logScale = chartState.scale === 'log' && minValue > 0;
  const normalize = value => logScale ? Math.log10(Number(value)) : Number(value);
  const axisMin = normalize(minValue), axisMax = normalize(maxValue);
  const xForIndex = index => points.length === 1
    ? left + (plotWidth / 2)
    : left + (index / (points.length - 1)) * plotWidth;
  const yForValue = value => top + ((axisMax - normalize(value)) / (axisMax - axisMin)) * plotHeight;

  const linePath = key => {
    let path = '', started = false;
    points.forEach((point, index) => {
      const value = Number(point[key]);
      if (point[key] === null || point[key] === undefined || !Number.isFinite(value)
          || (logScale && value <= 0)) { started = false; return; }
      path += `${started ? 'L' : 'M'}${xForIndex(index).toFixed(2)},${yForValue(value).toFixed(2)} `;
      started = true;
    });
    return path.trim();
  };

  const gridLines = [];
  for (let step = 0; step <= 4; step++) {
    const y = top + (step / 4) * plotHeight;
    const normalized = axisMax - ((axisMax - axisMin) * step / 4);
    const value = logScale ? Math.pow(10, normalized) : normalized;
    gridLines.push(
      `<line x1="${left}" y1="${y}" x2="${width - right}" y2="${y}" stroke="rgba(34,41,58,.65)" stroke-width="1" />`
      + `<text x="${left - 8}" y="${y + 4}" fill="#92a1b8" font-size="11" text-anchor="end">`
      + `${Math.round(value).toLocaleString()}</text>`);
  }

  const lines = visibleSeries.map(item =>
    `<path d="${linePath(item.key)}" fill="none" stroke="${escHtml(item.color)}" `
    + `stroke-width="${item.key === 'equity' ? 1.8 : 1.1}" stroke-linecap="round" stroke-linejoin="round" />`
  ).join('');

  chartState.render = {points, visibleSeries, width, height, left, right, top, bottom,
                       lastTooltipIndex: null};

  return `
    <svg class="chart-svg" viewBox="0 0 ${width} ${height}" role="img" aria-label="Research equity curve">
      ${gridLines.join('')}
      <rect x="${left}" y="${top}" width="${plotWidth}" height="${plotHeight}" fill="none" stroke="rgba(34,41,58,.75)" stroke-width="1" />
      ${lines}
      <line id="hover-line-${CHART_ID}" class="chart-hover-guide" stroke="rgba(167,179,200,.55)" stroke-width="1" stroke-dasharray="4 4" opacity="0" />
      <line id="hover-hline-${CHART_ID}" class="chart-hover-guide" stroke="rgba(167,179,200,.28)" stroke-width="1" stroke-dasharray="4 4" opacity="0" />
      <rect class="chart-overlay" x="${left}" y="${top}" width="${plotWidth}" height="${plotHeight}" fill="transparent" onmousemove="handleChartMove(event)" onmouseleave="handleChartLeave()"></rect>
      <text x="${left}" y="${height - 8}" fill="#92a1b8" font-size="11">${escHtml(fmtShortDate(points[0].date))}</text>
      <text x="${width - right}" y="${height - 8}" fill="#92a1b8" font-size="11" text-anchor="end">${escHtml(fmtShortDate(points[points.length - 1].date))}</text>
    </svg>`;
}

function renderChartPanel(chart) {
  if (!chart || chart.availability !== 'available') {
    return `<section class="panel chart-panel"><div class="section-title">Equity curve</div>
      <div class="chart-empty">No scored candidate has published a curve yet.</div></section>`;
  }
  ensureChartState(chart);
  const toggles = (chart.series || []).map(item =>
    `<button class="toggle-btn ${chartState.visible[item.key] ? 'active' : ''}" `
    + `style="--series-color:${escHtml(item.color)}" onclick="toggleSeries('${escHtml(item.key)}')">`
    + `${escHtml(item.label)}</button>`).join('');
  const scales = [['log', 'Log scale'], ['linear', 'Linear']].map(([key, label]) =>
    `<button class="scale-btn ${chartState.scale === key ? 'active' : ''}" onclick="setScale('${key}')">`
    + `${label}</button>`).join('');
  return `
    <section class="panel chart-panel">
      <div class="chart-head">
        <div>
          <div class="section-title">Best candidate — development window</div>
          <div class="chart-subtitle">Starting capital $10,000. Ends ${escHtml(fmtShortDate(chart.development_end))};
            the reserved holdout after that date is not plotted and was never scored.</div>
        </div>
        <div class="scale-toggles">${scales}</div>
      </div>
      <div class="series-toggles">${toggles}</div>
      <div class="chart-wrap">${buildChartSvg(chart)}</div>
    </section>`;
}

function renderSparkline(progression) {
  const scored = (progression || []).filter(row => Number.isFinite(Number(row.best_so_far)));
  if (scored.length < 2) return '<div class="chart-empty">Not enough scored experiments yet.</div>';
  const values = scored.map(row => Number(row.best_so_far));
  const width = 960, height = 120, left = 8, right = 8, top = 10, bottom = 10;
  const min = Math.min(...values), max = Math.max(...values);
  const span = max === min ? 1 : max - min;
  const path = values.map((value, index) => {
    const x = left + (index / (values.length - 1)) * (width - left - right);
    const y = top + ((max - value) / span) * (height - top - bottom);
    return `${index ? 'L' : 'M'}${x.toFixed(2)},${y.toFixed(2)}`;
  }).join(' ');
  const points = scored.map((row, index) => {
    if (row.status !== 'keep') return '';
    const x = left + (index / (values.length - 1)) * (width - left - right);
    const y = top + ((max - Number(row.best_so_far)) / span) * (height - top - bottom);
    return `<circle cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="2.6" fill="#00ff88" />`;
  }).join('');
  return `<svg class="spark" viewBox="0 0 ${width} ${height}" role="img" aria-label="Best score progression">
      <path d="${path}" fill="none" stroke="#00f0ff" stroke-width="1.6" />
      ${points}
    </svg>
    <div class="chart-subtitle">${scored.length} scored experiments · best so far
      ${escHtml(fmtRatio(max, 4))} · green marks a new best</div>`;
}

    <article class="strategy-card">
      <div class="card-header">

      </div>

        </div>
      </div>

      <div class="card-summary">
        <span class="summary-chip"><strong>Annual return:</strong>
          <span class="${signClass(best.annual_return)}">${escHtml(fmtPctOf(best.annual_return))}</span></span>
        <span class="summary-chip"><strong>Above cash:</strong>
          <span class="${signClass(best.excess_annual_return)}">${escHtml(fmtPctOf(best.excess_annual_return))}</span></span>
        <span class="summary-chip"><strong>Max DD:</strong>
          <span class="bad">${escHtml(fmtPctOf(best.max_drawdown))}</span></span>
        <span class="summary-chip"><strong>Sharpe:</strong> ${escHtml(fmtRatio(best.sharpe))}</span>
        <span class="summary-chip"><strong>Exposure:</strong> ${escHtml(fmtPctOf(best.average_gross_exposure, 1))}</span>
        <span class="summary-chip"><strong>ASSET_A b&amp;h:</strong>
          ${escHtml(fmtPctOf(benchmark.annual_return))} / ${escHtml(fmtPctOf(benchmark.max_drawdown))} DD</span>
      </div>

      ${renderChartPanel(research.chart)}

      <div class="panel-grid">
        <section class="panel">
          <h3>Development window</h3>
          ${kv([
            ['Window', `${escHtml(fmtShortDate(window.start))} → ${escHtml(fmtShortDate(window.end))}`],
            ['Sessions scored', fmtInt(window.sessions)],
            ['Early half, above cash', fmtPctOf(best.early_excess_annual_return)],
            ['Late half, above cash', fmtPctOf(best.late_excess_annual_return)],
            ['Early half, excess MAR', fmtRatio(best.early_excess_mar)],
            ['Late half, excess MAR', fmtRatio(best.late_excess_mar)],
            ['Modelled cash Annual return', fmtPctOf(best.cash_annual_return)],
            ['Annual return excluding interest', fmtPctOf(best.annual_return_ex_cash)],
          ])}
          <div class="reserved-note">${fmtInt(best.final_holdout_reserved_sessions)} further sessions
            are reserved as the final holdout. No score, gate, chart or file in the lab contains
            them. They are opened only by promotion validation, on the Historical tab.</div>
        </section>

          <h3>Search state</h3>

function renderRuns(runs) {
  if (!runs || !runs.length) return '<div class="chart-empty">No experiments recorded yet.</div>';
  const rows = runs.map(run => `
    <tr>
      <td>${escHtml(run.experiment_id || '—')}</td>
      <td>${escHtml(run.candidate_sha || '—')}</td>
      <td>${escHtml(run.stage || '—')}</td>
      <td class="${escHtml(run.status || '')}">${escHtml(run.status || '—')}</td>
      <td>${run.score ? escHtml(fmtRatio(run.score, 4)) : '<span class="kv-empty">—</span>'}</td>
    </tr>`).join('');
  return `<table class="runs-table">
      <thead><tr><th>Experiment</th><th>Candidate</th><th>Stage</th><th>Status</th><th>Score</th></tr></thead>
      <tbody>${rows}</tbody></table>`;
}

function emptyState(label, headline, body, blocked) {
  return `<article class="strategy-card"><div class="empty-state">
      <div class="glyph">${escHtml(label)}</div>
      <h2>${escHtml(headline)}</h2>
      <p>${escHtml(body)}</p>
      ${blocked ? `<div class="blocked">blocked by: ${escHtml(blocked)}</div>` : ''}
    </div></article>`;
}

function renderHistorical(payload) {
  const promotion = payload.promotion || {};
  const stage = (payload.lifecycle || []).find(item => item.key === 'historical') || {};
  if (!promotion.available) {
    return emptyState('Historical',
      'Nothing has been promoted.',
      'A promoted candidate is replayed here across all of history, including the reserved '
      + 'holdout that research never sees. Promotion validation has not been run against the '
      + 'current best candidate yet, so there is nothing honest to show.',
      stage.blocked_by);
  }
  const holdout = promotion.final_holdout || {};
  const full = promotion.full_history || {};
  const development = promotion.development || {};
  const bootstrap = promotion.path_robustness || {};
  const neighbourhood = promotion.parameter_neighbourhood || {};
  const score = neighbourhood.score || {};
  const rolling = promotion.rolling_stability || {};
  const cost = promotion.cost_stress || {};
  const ablation = promotion.dependency_ablation || [];
  return `
    <article class="strategy-card">
      <div class="card-header">
        <div class="card-title">
          <h2>PROMOTION VALIDATION</h2>
          <div class="meta">
            <span>candidate ${escHtml(promotion.candidate_sha || '—')}</span>
            <span class="muted">·</span><span>stage ${escHtml(promotion.stage || '—')}</span>
            <span class="muted">·</span><span>${escHtml(fmtTs(promotion.generated_at))}</span>
          </div>
        </div>
        <span class="badge idle">decision: ${escHtml(promotion.decision || 'none recorded')}</span>
      </div>

      <div class="reserved-note">This is the only view that opens the reserved holdout, and it does
        so for a candidate deliberately frozen for evaluation. Nothing here feeds a research score.</div>

      <div class="panel-grid">
        <section class="panel">
          <h3>Final holdout</h3>
          ${kv([
            ['Window', holdout.start
              ? `${escHtml(fmtShortDate(holdout.start))} → ${escHtml(fmtShortDate(holdout.end))}` : null],
            ['Sessions', fmtInt(holdout.sessions)],
            ['Above cash, development', fmtPctOf(holdout.development_excess_annual_return)],
            ['Above cash, holdout', `<span class="${signClass(holdout.excess_annual_return)}">`
              + `${escHtml(fmtPctOf(holdout.excess_annual_return))}</span>`],
            ['Decay', `<span class="${signClass(holdout.excess_annual_return_decay)}">`
              + `${escHtml(fmtPctOf(holdout.excess_annual_return_decay))}</span>`],
            ['Holdout max drawdown', fmtPctOf(holdout.max_drawdown)],
          ])}
        </section>
        <section class="panel">
          <h3>Full history</h3>
          ${kv([
            ['Annual return', fmtPctOf(full.annual_return)],
            ['Sharpe', fmtRatio(full.sharpe)],
            ['Max drawdown', fmtPctOf(full.max_drawdown)],
            ['Ending equity', fmtMoney(full.ending_equity)],
            ['Development Annual return', fmtPctOf(development.annual_return)],
            ['Development max drawdown', fmtPctOf(development.max_drawdown)],
          ])}
        </section>
        <section class="panel">
          <h3>Path &amp; parameter risk</h3>
          ${kv([
            ['Bootstrap paths', fmtInt(bootstrap.paths)],
            ['P(drawdown worse than −50%)', fmtPctOf(bootstrap.worse_than_50pct_drawdown)],
            ['Rolling windows positive', fmtPctOf(rolling.positive_share, 1)],
            ['Neighbourhood p5 / p50', `${escHtml(fmtRatio(score.p5, 4))} / ${escHtml(fmtRatio(score.p50, 4))}`],
            ['Fragile variants', fmtInt(neighbourhood.fragile)],
            ['Cost sensitivity at 20bps', fmtPctOf(cost.annual_return_cost_sensitivity)],
          ])}
        </section>
      </div>

      ${ablation.length ? `<section class="panel"><div class="section-title">Dependency ablation</div>
        <table class="runs-table"><thead><tr><th>Dropped</th><th>Verdict</th></tr></thead><tbody>
        ${ablation.map(row => `<tr><td>${escHtml(row.dropped)}</td><td>${escHtml(row.verdict)}</td></tr>`).join('')}
        </tbody></table></section>` : ''}
    </article>`;
}

function renderLaneStage(payload, key) {
  const stage = (payload.lifecycle || []).find(item => item.key === key) || {};
  const lanes = (payload.lanes || []).filter(lane => {
    if (key === 'modeled') return lane.modeled_enabled;
    if (key === 'paper') return lane.paper_enabled;
    if (key === 'live') return lane.live_enabled;
    return false;
  });
  if (!lanes.length) {
    return emptyState(stage.label || key, `${stage.label || key} is empty.`,
      stage.description || '', stage.blocked_by);
  }
  const rows = lanes.map(lane => `
    <tr>
      <td>${escHtml(lane.display_name)}</td>
      <td>${escHtml(lane.execution_contract || '—')}</td>
      <td class="${escHtml(lane.health.level)}">${escHtml(lane.health.level)}</td>
      <td>${escHtml(lane.current_asset || '—')} → ${escHtml(lane.target_asset || '—')}</td>
      <td>${escHtml(fmtTs(lane.last_run_ts))}</td>
    </tr>`).join('');
  return `<article class="strategy-card">
      <div class="card-header"><div class="card-title"><h2>${escHtml((stage.label || key).toUpperCase())}</h2>
        <div class="meta"><span>${escHtml(stage.description || '')}</span></div></div></div>
      <table class="runs-table">
        <thead><tr><th>Lane</th><th>Contract</th><th>Health</th><th>Position</th><th>Last run</th></tr></thead>
        <tbody>${rows}</tbody></table>
    </article>`;
}

    <div class="overview-card">
      <div class="overview-label">System</div>
      <div class="overview-value ${escHtml(summary.health || '')}">${escHtml((summary.health || '—').toUpperCase())}</div>
      <div class="overview-note">${escHtml(summary.stage || '')} stage</div>
    </div>
    <div class="overview-card">
      <div class="overview-label">Research stage</div>
      <div class="overview-value cyan">${escHtml(summary.research_stage || '—')}</div>
      <div class="overview-note">${escHtml(best.objective || '')}</div>
    </div>
    <div class="overview-card">
      <div class="overview-label">Best score</div>

      <div class="overview-note">above cash, development window</div>
    </div>

      <div class="overview-label">Experiments</div>

function renderLifecycle(payload) {
  const stages = payload.lifecycle || [];
  document.getElementById('lifecycle').innerHTML = stages.map((stage, index) =>
    `${index ? '<span class="life-arrow">&rsaquo;</span>' : ''}`
    + `<button class="life-btn state-${escHtml(stage.state)} ${activeStage === stage.key ? 'active' : ''}" `
    + `onclick="setStage('${escHtml(stage.key)}')" title="${escHtml(stage.description)}">`
    + `<span class="dot"></span>${escHtml(stage.label)}</button>`).join('');
}

function setStage(key) {
  activeStage = key;
  renderLifecycle(DASHBOARD);
  renderStage();
}

function renderStage() {
  if (!DASHBOARD) return;
  const view = document.getElementById('stage-view');
  if (activeStage === 'research') view.innerHTML = renderResearch(DASHBOARD);
  else if (activeStage === 'historical') view.innerHTML = renderHistorical(DASHBOARD);
  else view.innerHTML = renderLaneStage(DASHBOARD, activeStage);
}

  const contract = payload.contract || {};
  const dataset = payload.dataset || {};
  const actions = dataset.corporate_actions || {};
  const cash = dataset.cash_rate || {};

    <div class="panel-grid">
      <section class="panel">

      </section>

          ['Calendar', escHtml(dataset.calendar || '—')],
          ['Corporate actions', `${fmtInt(actions.splits)} splits · ${fmtInt(actions.dividends)} dividends`],
          ['Minute source', escHtml(dataset.minute_source || '—')],
          ['INDEX_V source', escHtml(dataset.index_source || '—')],
          ['Cash rate basis', escHtml(cash.basis || '—')],

function setLoading(active) {
  isLoading = active;
  const button = document.querySelector('.refresh-btn');
  if (button) {
    button.disabled = active;
    button.textContent = active ? 'LOADING...' : 'REFRESH';
    button.classList.toggle('loading-pulse', active);
  }
  if (active && !DASHBOARD) {
    document.getElementById('stage-view').innerHTML =
      '<div class="dashboard-loading"><div class="loading-title loading-pulse">Initializing</div>'
      + '<div class="loading-bar" aria-hidden="true"></div>'
      + '<div class="loading-hint">Reading canonical state</div></div>';
  }
}

async function loadDashboard() {
  if (isLoading) return;
  setLoading(true);
  try {
    const response = await api('/api/dashboard');
    if (!response.ok) throw new Error(`status ${response.status}`);
    DASHBOARD = await response.json();
    renderOverview(DASHBOARD);
    renderLifecycle(DASHBOARD);
    renderStage();
    renderFoundation(DASHBOARD);
  } catch (error) {
    document.getElementById('stage-view').innerHTML =
      `<article class="strategy-card"><div class="empty-state">
        <div class="glyph">ERROR</div><h2>Dashboard unavailable</h2>
        <p>${escHtml(error.message)}</p></div></article>`;
  } finally {
    setLoading(false);
  }
}

if (TOKEN) loadDashboard();
setInterval(() => { if (TOKEN) loadDashboard(); }, 120000);
