<style>

 .card{padding:22px 23px;margin-bottom:25px}.champ-head{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:flex-start}.champ-head h2,.card h2{font-size:20px;letter-spacing:-.02em;margin:0}.meta{color:var(--muted);font-size:12px;margin-top:7px;overflow-wrap:anywhere}.objective{color:var(--muted);font-size:12px;line-height:1.5;margin-top:6px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin:22px 0 17px;padding:0 0 17px;border-bottom:1px solid var(--line-soft);color:var(--muted-2)}.metrics span{display:flex;flex-direction:column;gap:7px;white-space:normal;font-size:10px}.metrics strong{font-weight:600;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}.metrics span span{font-size:20px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}.metrics .metric-cyan span{color:var(--cyan)}.metrics .metric-red span{color:var(--red)}.metrics .metric-green span{color:var(--green)}
.template-badge{display:inline-flex;align-items:center;border:1px solid var(--cyan);border-radius:999px;color:var(--cyan);font-size:10px;font-weight:750;letter-spacing:.6px;padding:4px 9px}.research-badge{border-color:var(--green);color:var(--green)}
  .chart{position:relative;border:1px solid var(--line-soft);border-radius:10px;background:linear-gradient(180deg,rgba(4,13,21,.65),rgba(2,9,15,.8));margin-top:10px;padding:9px 12px}.chart svg{display:block;width:100%;height:auto;max-height:300px}.chart-hitarea{cursor:crosshair;outline:none}.chart-hitarea:focus{stroke:var(--cyan);stroke-width:1}.chart-tooltip{position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}.chart-controls{display:flex;justify-content:flex-end;gap:8px;margin:0 3px 8px}.chart-controls button{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:6px 12px;font-size:10px;letter-spacing:.08em}.chart-controls button[aria-pressed="true"]{border-color:var(--cyan);color:var(--cyan);background:rgba(0,231,244,.08)}.replay-card{margin-bottom:30px}.replay-head{display:flex;align-items:center;justify-content:space-between;gap:18px}.replay-head h2{font-size:22px}.replay-card .metrics .metric-green span{color:var(--green)}.replay-card .metrics .metric-cyan span{color:var(--cyan)}.replay-card .metrics .metric-red span{color:var(--red)}.replay-card .template-badge{white-space:nowrap}

 .last-updated{text-align:right;color:var(--muted);font-size:11px;line-height:1.55;padding-top:3px}.champion-title{display:flex;align-items:center;gap:12px}.champion-name{font-size:15px;margin-top:5px;color:var(--text);font-weight:650}.champion-meta{font-size:10px;margin-top:3px;color:var(--muted);letter-spacing:.02em}.run-index{font-weight:700;color:var(--muted-2);font-variant-numeric:tabular-nums}.champion-details{margin-top:7px;color:var(--muted);font-size:11px}.champion-details summary,.replay-details summary{cursor:pointer;list-style:none;width:max-content;color:#8298aa;font-size:11px}.champion-details summary:hover,.replay-details summary:hover{color:var(--cyan)}.champion-details summary::-webkit-details-marker,.replay-details summary::-webkit-details-marker{display:none}.champion-details summary:before{content:"＋";margin-right:6px;color:#6e879a}.champion-details[open]>summary:before{content:"−"}.details-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 18px;margin:12px 0}.details-grid div{min-width:0}.details-grid dt{font-size:9px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted)}.details-grid dd{margin:3px 0 0;color:var(--muted-2);overflow-wrap:anywhere}.details-grid code{font-size:10px}.leader-metrics{display:flex;gap:24px;margin-top:14px}.leader-metrics div{display:grid;gap:4px}.leader-metrics span,.regime-results span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}.leader-metrics strong{font-size:20px;color:var(--cyan);font-variant-numeric:tabular-nums}.regime-results{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:15px}.regime-results div{display:grid;gap:5px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:rgba(11,22,35,.55)}.regime-results strong{font-size:12px;font-variant-numeric:tabular-nums}.regime-results .positive{color:var(--green)}.regime-results .negative{color:var(--red)}.weakest-regime{margin-top:10px;color:var(--muted-2);font-size:11px}.replay-details{margin-top:10px}.research-table .table th,.research-table .table td{padding:7px 8px}.research-table .table th:nth-child(n+3),.research-table .table td:nth-child(n+3){text-align:right}.research-table .meta{margin:0}.champ-head{align-items:center}.metrics{grid-template-columns:repeat(4,minmax(0,1fr))}.research-table .empty{padding:14px}.chart-unavailable{height:180px;display:grid;place-items:center;position:relative;color:var(--muted);font-size:13px}.chart-unavailable-grid{position:absolute;inset:12px;background-image:linear-gradient(rgba(25,63,82,.30) 1px,transparent 1px),linear-gradient(90deg,rgba(25,63,82,.30) 1px,transparent 1px);background-size:20% 25%;border-bottom:1px solid rgba(25,63,82,.5)}.chart-unavailable span{z-index:1;background:#06101a;padding:8px 13px}.template-inner{margin-top:13px;padding:14px;border:1px solid rgba(30,61,80,.75);border-radius:9px;background:rgba(3,11,18,.42)}.template-heading h3{font-size:17px;margin:0}.template-heading{margin-bottom:10px}.research-table-head{align-items:center}.trading-heading{display:block}
 @media(max-width:620px){.regime-results{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.regime-results div{padding:8px}.leader-metrics{gap:18px}.research-heading{gap:12px}.last-updated{display:none}.champ-head{align-items:flex-start}.metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:15px 10px}.template-inner{padding:11px}.updated-note{display:none}.card{padding:19px 15px;margin-bottom:20px}.replay-head h2{font-size:19px}.replay-card .metrics span span{font-size:18px}.chart svg{height:205px;max-height:none}.chart .chart-label{font-size:11px;transform-box:fill-box;transform-origin:center;transform:scaleX(2.4)}.chart .chart-axis-label,.chart .chart-title-label,.chart .chart-date-end{transform:scaleX(2.4);transform-origin:right center}.chart-controls button{min-height:32px}.tiles{gap:8px}.tile{padding:11px;min-height:70px}.tile .value{font-size:18px}.brand{font-size:21px}}
</style></head><body>
<div id="login"><h1>AUTOBOT</h1><div class="muted">Secure dashboard access</div><input type="password" id="code" maxlength="6" placeholder="••••••"><button class="button" onclick="doLogin()">ACCESS</button><span id="login-error" class="error"></span></div>
<div id="app"><header class="topbar"><a class="brand-lockup" href="/" aria-label="Autobot Growth Research"><span class="brand">AUTOBOT</span><span class="brand-caption">Growth Research</span></a><nav class="nav" aria-label="Primary"><a href="/research" data-route="research">Research</a><a href="/trading" data-route="trading">Trading</a></nav></header><main id="view"></main></div>
<script>
const BASE='__AUTOBOT_BASE_PATH__',KEY='autobot_token';let TOKEN=localStorage.getItem(KEY),route='research',research=null,trading=null,requestGeneration=0,activeRequest=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,options={}){const requestToken=TOKEN;const r=await fetch(BASE+path,{...options,headers:{'Content-Type':'application/json',...(requestToken?{Authorization:'Bearer '+requestToken}:{}),...(options.headers||{})}});if(r.status===401&&TOKEN===requestToken){localStorage.removeItem(KEY);TOKEN=null;document.getElementById('app').style.display='none';document.getElementById('login').style.display='flex';}return r}
async function doLogin(){const r=await api('/api/auth',{method:'POST',body:JSON.stringify({code:document.getElementById('code').value})});if(!r.ok){document.getElementById('login-error').textContent='Access denied';return}TOKEN=(await r.json()).token;localStorage.setItem(KEY,TOKEN);showApp();loadRoute()}
document.getElementById('code').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
function showApp(){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block'}
function currentRoute(){return location.pathname.endsWith('/trading')?'trading':'research'}
function navigate(next){const url=BASE+(next==='trading'?'/trading':'/research');history.pushState({},'',url);loadRoute(next)}
document.querySelector('.brand-lockup').href=BASE+'/';document.querySelectorAll('.nav a').forEach(a=>a.href=BASE+'/'+a.dataset.route);
document.querySelectorAll('.nav a').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();navigate(a.dataset.route)}));window.addEventListener('popstate',()=>{route=currentRoute();loadRoute()});
const money=v=>{if(v==null)return '—';const number=Number(v);if(!Number.isFinite(number))return '—';return number!==0&&(Math.abs(number)<1||Math.abs(number)>=1e15)?'$'+number.toExponential(2):number.toLocaleString('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0})};
const pct=v=>v==null?'—':(Number(v)*100).toFixed(2)+'%';const ratio=v=>v==null?'—':Number(v).toFixed(2);
const equityNumber=value=>{if(typeof value==='number')return Number.isFinite(value)&&value>0?value:null;if(typeof value!=='string'||! /^[+-]?(?:[0-9]+(?:\.[0-9]*)?|\.[0-9]+)(?:[eE][+-]?[0-9]+)?(?![\s\S])/.test(value))return null;const number=Number(value);return Number.isFinite(number)&&number>0?number:null};
function chartPoint(svg,index){
 const points=JSON.parse(svg.getAttribute("data-points")||"[]");
 if(!points.length)return;
 const i=Math.max(0,Math.min(points.length-1,index)),point=points[i],group=svg.parentNode.querySelector(".chart-inspection");
 if(!group)return;
 const crosshair=group.querySelector(".chart-crosshair"),marker=group.querySelector(".chart-point"),background=group.querySelector(".chart-tip-bg");
 crosshair.setAttribute("x1",point.x);crosshair.setAttribute("x2",point.x);
 marker.setAttribute("cx",point.x);marker.setAttribute("cy",point.y===null?16:point.y);marker.setAttribute("visibility",point.y===null?"hidden":"visible");
  const tipX=point.x>530?point.x-270:point.x+8;background.setAttribute("x",tipX);
 group.querySelector(".chart-tip-date").setAttribute("x",tipX+8);group.querySelector(".chart-tip-date").textContent=point.date;
  const value=point.equity===null?"Equity unavailable (missing mark)":(point.equity!==0&&(Math.abs(point.equity)<1||Math.abs(point.equity)>=1e15)?"$"+point.equity.toExponential(2):point.equity.toLocaleString("en-US",{style:"currency",currency:"USD",maximumFractionDigits:2}));
  group.querySelector(".chart-tip-equity").setAttribute("x",tipX+8);group.querySelector(".chart-tip-equity").textContent=value;
  const reference=point.benchmarkSymbol?`${point.benchmarkSymbol} buy & hold: ${point.benchmark==null?"Equity unavailable (missing mark)":money(point.benchmark)}`:"No reporting reference selected";
  const benchmarkTip=group.querySelector(".chart-tip-benchmark");if(benchmarkTip){benchmarkTip.setAttribute("x",tipX+8);benchmarkTip.textContent=reference}
  group.setAttribute("visibility","visible");svg.setAttribute("data-index",String(i));svg.setAttribute("aria-valuenow",String(i));svg.setAttribute("aria-valuetext",`${point.date}, strategy ${value}, ${reference}`);
  const live=svg.parentNode.querySelector(".chart-tooltip");if(live){live.textContent=`${point.date} · Strategy: ${value} · ${reference}`;live.hidden=false}
}
function chartPointer(event,svg){const box=svg.ownerSVGElement.getBoundingClientRect(),x=(event.clientX-box.left)/box.width*960,left=Number(svg.getAttribute("data-left"))||78,right=Number(svg.getAttribute("data-right"))||18;const points=JSON.parse(svg.getAttribute("data-points")||"[]");chartPoint(svg,Math.round((x-left)/(960-left-right)*(points.length-1)))}
function chartLeave(svg){if(document.activeElement!==svg){const group=svg.parentNode.querySelector(".chart-inspection");if(group)group.setAttribute("visibility","hidden");const live=svg.parentNode.querySelector(".chart-tooltip");if(live)live.hidden=true}}
function chartKey(event,svg){if(!["ArrowLeft","ArrowRight","Home","End"].includes(event.key))return;event.preventDefault();const points=JSON.parse(svg.getAttribute("data-points")||"[]"),current=Number(svg.getAttribute("data-index"))||0;chartPoint(svg,event.key==="Home"?0:event.key==="End"?points.length-1:current+(event.key==="ArrowRight"?1:-1))}
const chartScales={};const replaySeries={};const benchmarkSelections={};
function setChartScale(key,scale){chartScales[key]=scale;const host=document.getElementById(`plot-${key}`);if(host&&replaySeries[key])host.innerHTML=chart(replaySeries[key],scale)}
function setReplayBenchmark(key,symbol){benchmarkSelections[key]=symbol;const host=document.getElementById(`plot-${key}`);if(host&&replaySeries[key])host.innerHTML=chart(replaySeries[key],chartScales[key]||'log')}
function chart(data,scale='log'){
 if(data?.availability!=='available'||!data.points?.length)return '<div class="chart chart-unavailable"><div class="chart-unavailable-grid" aria-hidden="true"></div><span>Verified current-leader equity curve unavailable</span></div>';
 const cutoff=/^\d{4}-\d{2}-\d{2}$/.test(data.development_end||"")?data.development_end:null;
 const points=data.points.filter(point=>typeof point?.date==="string"&&(!cutoff||point.date<=cutoff));
 if(!points.length)return '<div class="chart chart-unavailable"><div class="chart-unavailable-grid" aria-hidden="true"></div><span>Verified current-leader equity curve unavailable</span></div>';
  const equities=points.map(point=>equityNumber(point.equity)),valid=equities.map(value=>value!==null);
  const selectedBenchmark=benchmarkSelections[data.chart_id]||'none';
  const candidateBenchmark=selectedBenchmark!=='none'?data.benchmarks?.[selectedBenchmark]:null;
  const benchmarkBlock=candidateBenchmark?.availability==='available'?candidateBenchmark:null;
  const benchmarkPoints=new Map((benchmarkBlock?.points||[]).map(point=>[point.date,equityNumber(point.equity)]));
  const benchmarkValues=points.map(point=>benchmarkPoints.get(point.date)??null);
  // Keep one stable axis domain for this period regardless of the visible overlay.
  const benchmarkDomainValues=Object.values(data.benchmarks||{})
    .filter(benchmark=>benchmark?.availability==='available')
    .flatMap(benchmark=>{const byDate=new Map((benchmark.points||[]).map(point=>[point.date,equityNumber(point.equity)]));return points.map(point=>byDate.get(point.date)??null)});
  const marks=[...equities,...benchmarkDomainValues].filter(value=>value!==null);
 if(marks.length<2)return '<div class="chart chart-unavailable"><div class="chart-unavailable-grid" aria-hidden="true"></div><span>Verified current-leader equity curve unavailable</span></div>';
  const w=960,h=250,narrow=typeof window!=='undefined'&&window.innerWidth<=620,left=narrow?172:78,right=narrow?172:18,top=16,bottom=36,plotH=h-top-bottom,lo=Math.min(...marks),hi=Math.max(...marks),isLog=scale==='log',transform=v=>isLog?Math.log10(v):v,inv=v=>isLog?10**v:v,span=transform(hi)-transform(lo)||Math.max(Math.abs(transform(hi))*.04,.04),low=transform(lo)-span*.05,high=transform(hi)+span*.05,range=high-low;
  const x=i=>left+i/(points.length-1)*(w-left-right),y=value=>top+(high-transform(value))/range*plotH;
  const ticks=Array.from({length:5},(_,i)=>inv(high-i*range/4)).filter(value=>Number.isFinite(value)&&value>0);if(isLog&&lo===Number.MIN_VALUE)ticks[ticks.length-1]=lo;
   const grid=ticks.map(value=>{const yy=top+(high-transform(value))/range*plotH;return `<line x1="${left}" y1="${yy}" x2="${w-right}" y2="${yy}" stroke="#22293a"/><text class="chart-label chart-axis-label" data-axis-value="${value}" x="${left-8}" y="${yy+4}" text-anchor="end" fill="#92a1b8" font-size="11">${esc(money(value))}</text>`}).join('');
 const segments=[];let segment=[];points.forEach((point,i)=>{if(valid[i])segment.push(`${x(i)},${y(equities[i])}`);else if(segment.length){segments.push(segment);segment=[]}});if(segment.length)segments.push(segment);
  // Separate translucent polygons create visible vertical seams at missing-mark boundaries.
  // Keep the gradient only for continuous data; sparse series stay an honest, clean line.
  const continuous=valid.every(Boolean);
   const paths=segments.filter(segment=>segment.length>1).map(segment=>{const first=segment[0].split(',')[0],last=segment[segment.length-1].split(',')[0],area=continuous&&!benchmarkBlock?`<polygon points="${first},${top+plotH} ${segment.join(' ')} ${last},${top+plotH}" fill="url(#equity-fill)"/>`:'';return `${area}<polyline fill="none" stroke="#00e7f4" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" points="${segment.join(' ')}"/>`}).join('');
  let benchmarkSegment=[];const benchmarkPaths=[];benchmarkValues.forEach((value,i)=>{if(value!==null&&value>0)benchmarkSegment.push(`${x(i)},${y(value)}`);else if(benchmarkSegment.length){if(benchmarkSegment.length>1)benchmarkPaths.push(benchmarkSegment);benchmarkSegment=[]}});if(benchmarkSegment.length>1)benchmarkPaths.push(benchmarkSegment);
  const benchmarkPath=benchmarkPaths.map(segment=>`<polyline fill="none" stroke="#f5a742" stroke-width="1.8" stroke-dasharray="6 4" stroke-linejoin="round" points="${segment.join(' ')}"/>`).join('');
  const interactionPoints=points.map((point,i)=>({x:x(i),y:valid[i]?y(equities[i]):null,date:point.date,equity:valid[i]?equities[i]:null,benchmark:benchmarkValues[i],benchmarkSymbol:benchmarkBlock?selectedBenchmark:null}));
 const tooltipId=`chart-tooltip-${esc(data.chart_id|| (data.replay?'replay':'history'))}`;
 const hitArea=`<rect class="chart-hitarea" x="${left}" y="${top}" width="${w-left-right}" height="${plotH}" fill="transparent" tabindex="0" role="slider" aria-valuemin="0" aria-valuemax="${points.length-1}" aria-valuenow="0" aria-label="Inspect chart data points. Use left and right arrow keys to move between dates." aria-describedby="${tooltipId}" data-left="${left}" data-right="${right}" data-index="0" data-points="${esc(JSON.stringify(interactionPoints))}" onpointermove="chartPointer(event,this)" onpointerleave="chartLeave(this)" onkeydown="chartKey(event,this)" onfocus="chartPoint(this,Number(this.getAttribute('data-index'))||0)"/>`;
  const inspection=`<g class="chart-inspection" visibility="hidden" pointer-events="none"><line class="chart-crosshair" x1="${left}" x2="${left}" y1="${top}" y2="${top+plotH}" stroke="#e8f3f8" stroke-dasharray="4 4"/><circle class="chart-point" cx="${left}" cy="${top}" r="4" fill="#22d3ee" stroke="#e8f3f8"/><rect class="chart-tip-bg" x="${left+8}" y="${top+5}" width="260" height="54" rx="4" fill="#0d1420" stroke="#22d3ee"/><text class="chart-tip-date" x="${left+16}" y="${top+20}" fill="#e8f3f8" font-size="11"></text><text class="chart-tip-equity" x="${left+16}" y="${top+35}" fill="#22d3ee" font-size="11"></text><text class="chart-tip-benchmark" x="${left+16}" y="${top+50}" fill="#f5a742" font-size="10"></text></g>`;
      const key=String(data.chart_id||'history'),fill=continuous&&!benchmarkBlock?`<linearGradient id="equity-fill-${esc(key)}" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#00ddeb" stop-opacity=".38"/><stop offset="100%" stop-color="#00ddeb" stop-opacity=".015"/></linearGradient>`:'';return `<div class="chart"><div class="chart-controls" role="group" aria-label="Chart scale"><button type="button" aria-pressed="${!isLog}" onclick="setChartScale('${esc(key)}','linear')">LINEAR</button><button type="button" aria-pressed="${isLog}" onclick="setChartScale('${esc(key)}','log')">LOG</button></div><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="group" aria-label="${esc(data.chart_label||(data.replay?'Historical replay':'Verified current research leader equity'))} on ${isLog?'positive logarithmic':'linear'} scale with gaps at missing marks"><defs>${fill}</defs><text class="chart-label chart-title-label" x="${w-right}" y="12" text-anchor="end" fill="#92a1b8" font-size="11">Equity (USD · ${isLog?'log':'linear'})</text>${grid}${benchmarkPath}${paths.replaceAll('url(#equity-fill)',`url(#equity-fill-${esc(key)})`)}${benchmarkBlock?'<text x="'+left+'" y="'+(top+12)+'" fill="#00e7f4" font-size="10">STRATEGY</text><text x="'+(left+78)+'" y="'+(top+12)+'" fill="#f5a742" font-size="10">'+esc(selectedBenchmark)+' buy &amp; hold</text>':''}${inspection}${hitArea}<text class="chart-label" x="${left}" y="${h-8}" fill="#92a1b8" font-size="11">${esc(points[0].date)}</text><text class="chart-label chart-date-end" x="${w-right}" y="${h-8}" text-anchor="end" fill="#92a1b8" font-size="11">${esc(points[points.length-1].date)}</text></svg><div id="${tooltipId}" class="chart-tooltip" role="tooltip" aria-live="polite" hidden></div></div>`
}
const LANE_STAGES=[["historical","Historical"],["modeled","Modeled"],["paper","Paper"],["trivial_capital","Trivial Capital"],["live","Live"]];let laneStageSelection="historical";
function replayCard(replay,key,title,subheading,showScore=false){
 const unavailable=`<article class="card replay-card"><h2>${esc(title)}</h2><div class="empty">Unavailable: no verified canonical replay evidence.</div></article>`;
 if(replay?.availability!=="available"||!replay.periods?.[key])return unavailable;
   const period=replay.periods[key],metrics=period.metrics||{},series={availability:"available",points:period.points||[],benchmarks:period.benchmarks||{},development_end:metrics.end_date||replay.dataset.latest,replay:true,chart_id:key,chart_label:title};replaySeries[key]=series;
 const score=showScore?replay.development_objective:null;
   const coverage=metrics.priced_sessions==null||metrics.missing_marks==null?"—":`${Number(metrics.priced_sessions).toLocaleString('en-US')} priced · ${Number(metrics.missing_marks).toLocaleString('en-US')} missing`;
   const metricItems=[["Annual return",pct(metrics.annual_return)],["Total Return",pct(metrics.total_return)],["Net Profit",money(metrics.net_profit)],["Sharpe",metrics.sharpe==null?"—":ratio(metrics.sharpe)],["Max Drawdown",pct(metrics.max_drawdown)],["Ending Equity",money(metrics.ending_equity)],["Starting Capital",money(metrics.starting_capital??replay.configuration?.starting_capital)],["Mark Coverage",coverage],["Executed Fills",metrics.executed_fills==null?"—":Number(metrics.executed_fills).toLocaleString('en-US')]];
 if(score)metricItems.push(["Development Score",researchScore(score.score)]);
 const isDevelopment=key==="development";
 const scoreWindow=`${replay.development_objective.window.start} through ${replay.development_objective.window.end}`;
 const startCapital=money(Number(metrics.starting_capital??replay.configuration.starting_capital));
 const details=`<details class="replay-details"><summary>Details</summary><dl class="details-grid"><div><dt>Experiment / candidate SHA-256</dt><dd><code>${esc(replay.candidate.experiment_id)} · ${esc(replay.candidate.sha256)}</code></dd></div><div><dt>Contract</dt><dd>${esc(replay.contract.version)} · <code>${esc(replay.contract.sha256)}</code></dd></div><div><dt>Dataset manifest / snapshot SHA-256</dt><dd><code>${esc(replay.dataset.manifest_sha256)}</code> · <code>${esc(replay.dataset.snapshot_hash||"—")}</code></dd></div><div><dt>Starting capital</dt><dd>${esc(startCapital)} · fresh ledger from ${esc(metrics.start_date||"—")}</dd></div><div><dt>State initialization</dt><dd>${esc(metrics.state_initialization||replay.configuration.state_initialization)}</dd></div><div><dt>Executed fills by symbol</dt><dd>${esc(JSON.stringify(metrics.executed_fills_by_symbol||{}))}</dd></div>${isDevelopment?`<div><dt>Objective score window</dt><dd>${esc(scoreWindow)}</dd></div>`:""}<div><dt>Objective / evaluator</dt><dd>${esc(replay.configuration.objective)} · ${esc(replay.development_objective?.evaluator_version||"canonical evaluator")}</dd></div><div><dt>Slippage</dt><dd>${esc(replay.configuration.slippage)} each way</dd></div><div><dt>Definitions</dt><dd>Annual return: endpoint equity / starting capital annualized over calendar days (365.25). Total return: end / start − 1. Net profit: ending equity − starting capital. Drawdown: peak-to-trough from fresh start. Sharpe: simple marked returns, sample deviation, √252 annualization.</dd></div><div><dt>Priced sessions / missing marks</dt><dd>${esc(metrics.priced_sessions??"—")} / ${esc(metrics.missing_marks??"—")}. Missing marks remain gaps; no interpolation or zero substitution.</dd></div>${isDevelopment?"":`<div><dt>Interpretation</dt><dd>Post-selection descriptive replay only, not out-of-sample validation, promotion evidence, or a forecast. It never feeds research selection or scoring.</dd></div>`}<div><dt>Candidate settings</dt><dd><code>${esc(JSON.stringify(replay.configuration.strategy_config||{}))}</code></dd></div><div><dt>Configuration SHA-256</dt><dd><code>${esc(replay.configuration.strategy_config_sha256)}</code></dd></div></dl></details>`;
 const titleBadge=isDevelopment?"IN-SAMPLE / SEARCH":"POST-SELECTION";
 const metricTone=label=>{const raw=label==="Annual return"?metrics.annual_return:label==="Total Return"?metrics.total_return:label==="Net Profit"?metrics.net_profit:label==="Max Drawdown"?metrics.max_drawdown:label==="Sharpe"?metrics.sharpe:label==="Ending Equity"?metrics.ending_equity:label==="Development Score"?score?.score:null;if(raw==null||!Number.isFinite(Number(raw)))return"";if(label==="Max Drawdown")return"red";if(["Sharpe","Ending Equity","Development Score"].includes(label))return"cyan";return Number(raw)>=0?"green":"red"};
   const option=symbol=>{const block=period.benchmarks?.[symbol],available=block?.availability==="available",reason=block?.metrics?.unavailable_reason;return `<option value="${symbol}" ${available?"":`disabled title="${esc(reason||"Benchmark unavailable")}"`}>${symbol} ${available?"buy &amp; hold":`unavailable · ${esc(reason||"no valid marks")}`}</option>`};
 return `<article class="card replay-card"><div class="replay-head"><div><h2>${esc(title)}</h2><div class="meta">${esc(metrics.start_date||"—")} → ${esc(metrics.end_date||"—")} · Start ${esc(startCapital)}</div></div><span class="template-badge ${isDevelopment?'research-badge':''}">${titleBadge}</span></div><div class="metrics">${metricItems.map(([label,value])=>`<span class="metric-${metricTone(label)}"><strong>${esc(label)}</strong><span>${esc(value)}</span></span>`).join("")}</div><label class="benchmark-picker" title="Overlay one independent buy-and-hold reporting reference. The strategy curve remains primary; this selection does not affect scale or strategy results.">Reporting reference <select aria-label="Buy-and-hold reporting reference" onchange="setReplayBenchmark('${key}',this.value)"><option value="none">None</option>${option("ASSET_A")}${option("ASSET_B")}</select></label><div id="plot-${key}">${chart(series,chartScales[key]||'log')}</div>${details}</article>`
}
function renderLaneStage(stage,data){
 const replay=data?.historical_replay;
 if(stage==="historical")return replayCard(replay,"through_present","Historical Replay","",false);
 const labels={modeled:"Modeled",paper:"Paper",trivial_capital:"Trivial Capital",live:"Live"};
 return `<div class="lane-content" role="tabpanel"><strong>${esc(labels[stage]||stage)} unavailable.</strong> No verified matching canonical candidate/contract record exists. This tab is disabled; no capital, order, or promotion action is available.</div>`
}
function renderTemplate(data){
 const champion=data?.leader,replay=data?.historical_replay,verified=Boolean(champion&&replay?.availability==="available"&&replay.candidate?.sha256===champion.candidate_sha256&&replay.candidate?.experiment_id===champion.experiment_id&&replay.contract?.version===champion.contract_version&&replay.contract?.sha256===champion.contract_sha256);
 const tabs=LANE_STAGES.map(([key,label])=>{const enabled=key==="historical"&&verified,disabled=enabled?"":"disabled title='Unavailable: no verified stage evidence'";return `<button type="button" role="tab" aria-selected="${laneStageSelection===key}" aria-disabled="${!enabled}" ${disabled} class="${laneStageSelection===key&&enabled?'active':''}" onclick="selectLaneStage('${key}')">${label}</button>`}).join('');
   return `<article class="card template-card"><div class="template-title"><div><h2>Research · Current Leader</h2><div class="meta">${esc(champion?`Growth · ${champion.experiment_id}`:"No current v4 research leader")}</div></div><span class="template-badge research-badge">${champion?(champion.leader_type==="qualified"?"QUALIFIED CHAMPION · 4/4 REGIMES":"PROVISIONAL"):"UNAVAILABLE"}</span></div><div class="meta">NOT PROMOTED · NO CAPITAL AT RISK · no orders or promotion</div>${champion?`<details class="champion-details"><summary>Identity details</summary><dl class="details-grid"><div><dt>Candidate SHA-256</dt><dd><code>${esc(champion.candidate_sha256)}</code></dd></div><div><dt>Contract</dt><dd>${esc(champion.contract_version)} · <code>${esc(champion.contract_sha256)}</code></dd></div><div><dt>Dataset manifest SHA-256</dt><dd><code>${esc(champion.dataset_manifest_sha256)}</code></dd></div></dl></details>`:""}<div class="lane-tabs" role="tablist" aria-label="Strategy lifecycle">${tabs}</div>${verified?renderLaneStage(laneStageSelection,{champion,historical_replay:replay}):'<div class="lane-content">Replay unavailable until exact current leader and contract identity match verified replay evidence.</div>'}</article>`
}
function renderTrading(data){const lanes=Array.isArray(data?.lanes)?data.lanes:[];return `<section class="trading-heading"><h1>Trading</h1></section>${lanes.map(lane=>`<article class="card"><h2>${esc(lane.display_name)}</h2><div class="meta">${esc(lane.lane_id)}</div></article>`).join('')}${renderTemplate(data)}`}
function selectLaneStage(stage){if(!LANE_STAGES.some(([key])=>key===stage)||stage!=="historical")return;laneStageSelection=stage;document.getElementById('view').innerHTML=renderTrading(trading||{lanes:[]})}
function renderRouteError(name,message){return `<article class="card empty error" role="status"><h2>${name} unavailable</h2><p>${esc(message)}</p></article>`}
async function loadRoute(target=currentRoute()){if(!TOKEN)return;route=target==='trading'?'trading':'research';const requestRoute=route,generation=++requestGeneration;if(activeRequest)activeRequest.abort();const controller=new AbortController();activeRequest=controller;document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('active',a.dataset.route===requestRoute));try{const endpoint=requestRoute==='trading'?'/api/dashboard/trading':'/api/dashboard/research';const response=await api(endpoint,{signal:controller.signal});if(!response.ok)throw Error(`Request failed (${response.status})`);const data=await response.json();if(generation!==requestGeneration)return;try{const replayResponse=await api('/api/dashboard/replay',{signal:controller.signal});if(replayResponse.ok)Object.assign(data,await replayResponse.json())}catch{}if(generation!==requestGeneration)return;if(requestRoute==='trading'){trading=data;document.getElementById('view').innerHTML=renderTrading(data)}else{research=data;document.getElementById('view').innerHTML=renderResearch(data)}}catch(e){if(generation===requestGeneration&&e.name!=='AbortError'&&TOKEN)document.getElementById('view').innerHTML=renderRouteError(requestRoute==='trading'?'Trading':'Research',e.message)}finally{if(generation===requestGeneration)activeRequest=null}}
if(TOKEN){showApp();route=currentRoute();loadRoute(route)}setInterval(()=>{if(TOKEN)loadRoute(currentRoute())},120000);
function experimentDate(id){const m=/^(\d{4})(\d{2})(\d{2})_/.exec(String(id??""));if(!m)return"—";const year=Number(m[1]),month=Number(m[2]),day=Number(m[3]),date=new Date(Date.UTC(year,month-1,day));if(date.getUTCFullYear()!==year||date.getUTCMonth()!==month-1||date.getUTCDate()!==day)return"—";return date.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric",timeZone:"UTC"})}
function researchScore(value){if(value==null||value==="")return"—";const number=Number(value);return Number.isFinite(number)?number.toFixed(4):"—"}
function renderResearch(data){
  const c=data.leader,n=data.counts||{},a=data.activity||{},recent=Array.isArray(data.recent)?data.recent.slice(0,5):[],replay=data.historical_replay;
  const state=a.state==='active'?'RUNNING':(a.state||'unknown').toUpperCase(),running=a.state==='active';
 const rows=recent.length?recent.map((r,i)=>`<tr class="${c&&r.experiment_id===c.experiment_id?'champ-row':''}"><td title="Experiment ID: ${esc(r.experiment_id)}"><span class="run-index">${c&&r.experiment_id===c.experiment_id?'★ ':''}${String(i+1).padStart(2,'0')}</span></td><td>${esc(experimentDate(r.experiment_id))}</td><td>${esc(pct(r.development_annual_return))}</td></tr>`).join(''):'<tr><td colspan="4" class="empty">No recent experiments.</td></tr>';
  const leaderLabel=c?.leader_type==='qualified'?'QUALIFIED CHAMPION · 4/4 REGIMES':c?.leader_type==='provisional'?'PROVISIONAL':c?'CURRENT LEADER':'NO CURRENT V4 LEADER';
  const championDetails=c?`<div class="leader-metrics"><div><span>Full-development Annual return · ${esc(c.development_start)} → ${esc(c.development_end)}</span><strong>${pct(c.development_annual_return)}</strong></div><div><span>Regimes passed</span><strong>${esc(c.regimes_passed)}/4</strong></div></div><div class="regime-results">${(c.regime_results||[]).map(r=>`<div><span>${esc(r.label||r.key)}</span><strong class="${r.qualifies?'positive':'negative'}">${pct(r.excess_annual_return)} excess Annual return vs modeled cash · ${r.qualifies?'PASS':'FAIL'}</strong></div>`).join('')}</div>${c.weakest_regime?`<div class="weakest-regime">Weakest regime · ${esc(c.weakest_regime.label||c.weakest_regime.key)} · ${pct(c.weakest_regime.excess_annual_return)} excess Annual return vs modeled cash</div>`:''}<details class="champion-details"><summary>Leader identity</summary><dl class="details-grid"><div><dt>Candidate ID</dt><dd><code>${esc(c.experiment_id)}</code></dd></div><div><dt>Candidate SHA-256</dt><dd><code>${esc(c.candidate_sha256||'—')}</code></dd></div><div><dt>Evaluator</dt><dd>${esc(c.evaluator_version||'—')}</dd></div></dl></details>`:'';
 return `<section class="research-heading"><div><h1>Research</h1></div>${a.updated_at?`<div class="last-updated">Updated ${esc(a.updated_at)}</div>`:''}</section>
 <section class="tiles"><div class="tile"><div class="label">Process</div><div class="value ${running?'green':''}">${esc(state)}${running?'<span class="status-dot" aria-hidden="true"></span>':''}</div></div><div class="tile"><div class="label">Experiments</div><div class="value">${esc(n.valid_attempts??'—')}</div></div><div class="tile"><div class="label">Scored</div><div class="value cyan">${esc(n.scored??'—')}</div></div></section>
   <article class="card champion-card"><div class="champ-head"><div><div class="champion-title"><h2>Current Research Leader</h2><span class="template-badge research-badge">${esc(leaderLabel)}</span></div><div class="champion-name">${c?`Candidate ${esc(c.experiment_id)}`:'No current v4 leader'}</div></div></div>${championDetails}</article>
 ${replayCard(replay,'development','Development Replay','',true)}${replayCard(replay,'five_year','Five-Year Replay','',false)}${replayCard(replay,'ten_year','Ten-Year Replay','',false)}${replayCard(replay,'through_present','Through-Present / Full-History Replay','',false)}
 <article class="card research-table"><div class="research-table-head"><div><h3>Recent Experiments</h3><div class="meta">Existing development results · no post-selection replay values · distinct SHA-12 prefixes; legacy rows may not have full source SHA-256</div></div></div><table class="table"><thead><tr><th>Run</th><th>Date</th><th>Development Annual return</th></tr></thead><tbody>${rows}</tbody></table></article>`
}
</script></body></html>
