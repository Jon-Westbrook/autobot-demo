order:1px solid var(--cyan);border-radius:2px;background:rgba(34,211,238,.1)}.chart>.empty{padding:12px}.research-table{margin-top:14px}.research-table h3{font-size:13px;margin:0 0 4px}.research-table .meta{font-size:11px;margin:0 0 5px}.error{color:#ff5c7a}

</style></head><body>
<div id="login"><h1>AUTOBOT</h1><div class="muted">Secure dashboard access</div><input type="password" id="code" maxlength="6" placeholder="••••••"><button class="button" onclick="doLogin()">ACCESS</button><span id="login-error" class="error"></span></div>
<div id="app"><header class="topbar"><a class="brand-lockup" href="/" aria-label="Autobot Growth Research"><span class="brand">AUTOBOT</span><span class="brand-caption">Growth Research</span></a><nav class="nav" aria-label="Primary"><a href="/research" data-route="research">Research</a><a href="/trading" data-route="trading">Trading</a></nav></header><main id="view"></main></div>
<script>
const BASE='__AUTOBOT_BASE_PATH__',KEY='autobot_token';let TOKEN=localStorage.getItem(KEY),route='research',research=null,trading=null,requestGeneration=0,activeRequest=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,options={}){const requestToken=TOKEN;const r=await fetch(BASE+path,{...options,headers:{'Content-Type':'application/json',...(requestToken?{Authorization:'Bearer '+requestToken}:{}),...(options.headers||{})}});if(r.status===401&&TOKEN===requestToken){localStorage.removeItem(KEY);TOKEN=null;document.getElementById('app').style.display='none';document.getElementById('login').style.display='flex';}return r}
async function doLogin(){const r=await api('/api/auth',{method:'POST',body:JSON.stringify({code:document.getElementById('code').value})});if(!r.ok){document.getElementById('login-error').textContent='Access denied';return}TOKEN=(await r.json()).token;localStorage.setItem(KEY,TOKEN);showApp();loadRoute()}
document.getElementById('code').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
function showApp(){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block'}
function currentRoute(){return location.pathname.endsWith('/trading')?'trading':'research'}
function navigate(next){const url=BASE+(next==='trading'?'/trading':'/research');history.pushState({},'',url);loadRoute(next)}
document.querySelector('.brand').href=BASE+'/';document.querySelectorAll('.nav a').forEach(a=>a.href=BASE+'/'+a.dataset.route);
document.querySelectorAll('.nav a').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();navigate(a.dataset.route)}));window.addEventListener('popstate',()=>{route=currentRoute();loadRoute()});
const money=v=>{if(v==null)return '—';const number=Number(v);if(!Number.isFinite(number))return '—';return number!==0&&(Math.abs(number)<1||Math.abs(number)>=1e15)?'$'+number.toExponential(2):number.toLocaleString('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0})};
const pct=v=>v==null?'—':(Number(v)*100).toFixed(2)+'%';const ratio=v=>v==null?'—':Number(v).toFixed(2);
const equityNumber=value=>{if(typeof value==='number')return Number.isFinite(value)&&value>0?value:null;if(typeof value!=='string'||! /^[+-]?(?:[0-9]+(?:\.[0-9]*)?|\.[0-9]+)(?:[eE][+-]?[0-9]+)?(?![\s\S])/.test(value))return null;const number=Number(value);return Number.isFinite(number)&&number>0?number:null};
function chartPoint(svg,index){
 const points=JSON.parse(svg.getAttribute("data-points")||"[]");
 if(!points.length)return;
 const i=Math.max(0,Math.min(points.length-1,index)),point=points[i],group=svg.parentNode.querySelector(".chart-inspection");
 if(!group)return;
 const crosshair=group.querySelector(".chart-crosshair"),marker=group.querySelector(".chart-point"),background=group.querySelector(".chart-tip-bg");
 crosshair.setAttribute("x1",point.x);crosshair.setAttribute("x2",point.x);
 marker.setAttribute("cx",point.x);marker.setAttribute("cy",point.y===null?16:point.y);marker.setAttribute("visibility",point.y===null?"hidden":"visible");
 const tipX=point.x>500?point.x-246:point.x+8;background.setAttribute("x",tipX);
 group.querySelector(".chart-tip-date").setAttribute("x",tipX+8);group.querySelector(".chart-tip-date").textContent=point.date;
 const value=point.equity===null?"Equity unavailable (missing mark)":(point.equity!==0&&(Math.abs(point.equity)<1||Math.abs(point.equity)>=1e15)?"$"+point.equity.toExponential(2):point.equity.toLocaleString("en-US",{style:"currency",currency:"USD",maximumFractionDigits:2}));
 group.querySelector(".chart-tip-equity").setAttribute("x",tipX+8);group.querySelector(".chart-tip-equity").textContent=value;
 group.setAttribute("visibility","visible");svg.setAttribute("data-index",String(i));svg.setAttribute("aria-valuenow",String(i));svg.setAttribute("aria-valuetext",`${point.date}, ${value}`);
 const live=svg.parentNode.querySelector(".chart-tooltip");if(live){live.textContent=`${point.date} · ${value}`;live.hidden=false}
}
function chartPointer(event,svg){const box=svg.ownerSVGElement.getBoundingClientRect(),x=(event.clientX-box.left)/box.width*960;const points=JSON.parse(svg.getAttribute("data-points")||"[]");chartPoint(svg,Math.round((x-78)/(960-78-18)*(points.length-1)))}
function chartLeave(svg){if(document.activeElement!==svg){const group=svg.parentNode.querySelector(".chart-inspection");if(group)group.setAttribute("visibility","hidden");const live=svg.parentNode.querySelector(".chart-tooltip");if(live)live.hidden=true}}
function chartKey(event,svg){if(!["ArrowLeft","ArrowRight","Home","End"].includes(event.key))return;event.preventDefault();const points=JSON.parse(svg.getAttribute("data-points")||"[]"),current=Number(svg.getAttribute("data-index"))||0;chartPoint(svg,event.key==="Home"?0:event.key==="End"?points.length-1:current+(event.key==="ArrowRight"?1:-1))}
function chart(data){
 if(data?.availability!=='available'||!data.points?.length)return '<div class="empty">Verified champion development-history curve unavailable.</div>';
 const cutoff=/^\d{4}-\d{2}-\d{2}$/.test(data.development_end||"")?data.development_end:null;
 const points=data.points.filter(point=>typeof point?.date==="string"&&(!cutoff||point.date<=cutoff));
 if(!points.length)return '<div class="empty">Verified champion development-history curve unavailable.</div>';
 const equities=points.map(point=>equityNumber(point.equity)),valid=equities.map(value=>value!==null);
 const marks=equities.filter(value=>value!==null);
 if(marks.length<2)return '<div class="empty">Verified champion development-history curve unavailable.</div>';
 const w=960,h=250,left=78,right=18,top=16,bottom=36,plotH=h-top-bottom,lo=Math.min(...marks),hi=Math.max(...marks),logLo=Math.log10(lo),logHi=Math.log10(hi),logSpan=logHi-logLo||.04,minLog=Math.log10(Number.MIN_VALUE),maxLog=Math.log10(Number.MAX_VALUE),low=Math.max(minLog,logLo-logSpan*.05),high=Math.min(maxLog,logHi+logSpan*.05),range=high-low;
 const x=i=>left+i/(points.length-1)*(w-left-right),y=value=>top+(high-Math.log10(value))/range*plotH;
 const ticks=Array.from({length:5},(_,i)=>10**(high-i*range/4)).filter(value=>Number.isFinite(value)&&value>0);
 const grid=ticks.map(value=>{const yy=top+(high-Math.log10(value))/range*plotH;return `<line x1="${left}" y1="${yy}" x2="${w-right}" y2="${yy}" stroke="#22293a"/><text data-axis-value="${value}" x="${left-8}" y="${yy+4}" text-anchor="end" fill="#92a1b8" font-size="11">${esc(money(value))}</text>`}).join('');
 const segments=[];let segment=[];points.forEach((point,i)=>{if(valid[i])segment.push(`${x(i)},${y(equities[i])}`);else if(segment.length){segments.push(segment);segment=[]}});if(segment.length)segments.push(segment);
 const paths=segments.filter(segment=>segment.length>1).map(segment=>`<polyline fill="none" stroke="#00f0ff" stroke-width="2" points="${segment.join(' ')}"/>`).join('');
 const interactionPoints=points.map((point,i)=>({x:x(i),y:valid[i]?y(equities[i]):null,date:point.date,equity:valid[i]?equities[i]:null}));
 const tooltipId=`chart-tooltip-${data.replay?'replay':'history'}`;
 const hitArea=`<rect class="chart-hitarea" x="${left}" y="${top}" width="${w-left-right}" height="${plotH}" fill="transparent" tabindex="0" role="slider" aria-valuemin="0" aria-valuemax="${points.length-1}" aria-valuenow="0" aria-label="Inspect chart data points. Use left and right arrow keys to move between dates." aria-describedby="${tooltipId}" data-index="0" data-points="${esc(JSON.stringify(interactionPoints))}" onpointermove="chartPointer(event,this)" onpointerleave="chartLeave(this)" onkeydown="chartKey(event,this)" onfocus="chartPoint(this,Number(this.getAttribute('data-index'))||0)"/>`;
 const inspection=`<g class="chart-inspection" visibility="hidden" pointer-events="none"><line class="chart-crosshair" x1="${left}" x2="${left}" y1="${top}" y2="${top+plotH}" stroke="#e8f3f8" stroke-dasharray="4 4"/><circle class="chart-point" cx="${left}" cy="${top}" r="4" fill="#22d3ee" stroke="#e8f3f8"/><rect class="chart-tip-bg" x="${left+8}" y="${top+5}" width="230" height="38" rx="4" fill="#0d1420" stroke="#22d3ee"/><text class="chart-tip-date" x="${left+16}" y="${top+20}" fill="#e8f3f8" font-size="11"></text><text class="chart-tip-equity" x="${left+16}" y="${top+35}" fill="#22d3ee" font-size="11"></text></g>`;
 const gapText=data.gap_count?`${data.gap_count} missing mark${data.gap_count===1?'':'s'} shown as gaps; no data is invented or smoothed.`:'No missing marks.';
  return `<div class="objective">${data.replay?'Five-year historical replay':'Verified historical equity'} · ${esc(data.development_start)} through ${esc(data.development_end)}. Starting equity comes from the first verified numeric mark; ending equity: ${esc(money(data.ending_equity))}. ${esc(gapText)}${data.replay?' Hypothetical result; not a forecast or live performance.':' The chart uses verified historical marks through the development cutoff.'}</div><div class="chart"><svg viewBox="0 0 ${w} ${h}" role="group" aria-label="${data.replay?'Five-year hypothetical replay':'Verified historical champion equity'} on a positive logarithmic scale with gaps at missing marks"><text x="${left}" y="12" fill="#92a1b8" font-size="11">Equity (USD · log scale)</text>${grid}${paths}${inspection}${hitArea}<text x="${left}" y="${h-8}" fill="#92a1b8" font-size="11">${esc(points[0].date)}</text><text x="${w-right}" y="${h-8}" text-anchor="end" fill="#92a1b8" font-size="11">${esc(points[points.length-1].date)}</text></svg><div id="${tooltipId}" class="chart-tooltip" role="tooltip" aria-live="polite" hidden></div></div>`
}
function fiveYearReplay(data,championCutoff){
 const unavailable='<article class="card"><h2>Five-year historical replay</h2><div class="empty">Unavailable: verified champion equity marks do not cover a complete five-year development window.</div></article>';
 if(data?.availability!=="available"||!Array.isArray(data.points)||data.development_end!==championCutoff||!/^\d{4}-\d{2}-\d{2}$/.test(championCutoff||""))return unavailable;
 const cutoff=new Date(`${championCutoff}T00:00:00Z`);
 if(!Number.isFinite(cutoff.getTime())||cutoff.toISOString().slice(0,10)!==championCutoff)return unavailable;
 const start=new Date(cutoff);start.setUTCFullYear(start.getUTCFullYear()-5);
 const startDate=start.toISOString().slice(0,10),latestStart=new Date(start);latestStart.setUTCDate(latestStart.getUTCDate()+31);
 const earliestEnd=new Date(cutoff);earliestEnd.setUTCDate(earliestEnd.getUTCDate()-7);
 // Date-filter before touching equity: post-cutoff values are never read or rendered.
 const bounded=data.points.filter(point=>typeof point?.date==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(point.date)&&point.date<=championCutoff&&point.date>=startDate);
 const verified=bounded.map(point=>({date:point.date,equity:equityNumber(point.equity)}));
 const marks=verified.filter(point=>point.equity!==null);
 if(marks.length<2||marks[0].date>latestStart.toISOString().slice(0,10)||marks[marks.length-1].date<earliestEnd.toISOString().slice(0,10))return unavailable;
 const base=marks[0].equity,rebased=verified.map(point=>({date:point.date,equity:point.equity===null?null:10000*(point.equity/base)}));
 const ending=marks[marks.length-1].equity/base*10000;
 const replay={...data,availability:"available",development_start:marks[0].date,development_end:marks[marks.length-1].date,ending_equity:ending,gap_count:rebased.filter(point=>point.equity===null).length,points:rebased,replay:true};
 return `<article class="card"><h2>Five-year historical replay of $10,000</h2><div class="objective">Historical modeled results are not guarantees or live performance. Window anchored to the champion development cutoff ${esc(championCutoff)}; plotted verified marks run ${esc(marks[0].date)} through ${esc(marks[marks.length-1].date)}. Rebased from the first verified equity mark ($10,000 starting value) to a hypothetical ending value of ${esc(money(ending))}. Missing marks remain gaps; no forward-fill, interpolation, or fabricated points.</div>${chart(replay)}</article>`
}
const LANE_STAGES=[["historical","Historical"],["modeled","Modeled"],["paper","Paper"],["trivial_capital","Trivial Capital"],["live","Live"]];let laneStageSelection="historical";
function renderLaneStage(stage){return `<div class="lane-content" role="tabpanel"><strong>${esc(LANE_STAGES.find(([key])=>key===stage)?.[1]||"Historical")}:</strong> Illustrative template only. No verified ${esc(stage)} data is available.</div>`}
function renderTemplate(){return `<article class="card"><div class="template-title"><div><h2>Example Strategy</h2><div class="meta">Illustrative template · not an active or paper strategy</div></div><span class="template-badge">TEMPLATE</span></div><div class="lane-tabs" role="tablist" aria-label="Example strategy lifecycle">${LANE_STAGES.map(([key,label])=>`<button type="button" role="tab" aria-selected="${laneStageSelection===key}" class="${laneStageSelection===key?'active':''}" onclick="selectLaneStage('${key}')">${label}</button>`).join('')}</div>${renderLaneStage(laneStageSelection)}<div class="example-grid"><div class="label">Historical performance · no verified template series</div><div class="example-chart" role="img" aria-label="Template chart placeholder; no verified data plotted"><span>Verified historical series unavailable<br>— no data plotted —</span></div><div class="example-metrics">${[['Strategies','—','Unavailable: no verified strategy count for this example'],['Capital','—','Unavailable: no verified capital value'],['Total Return','—','Unavailable: no verified return value'],['System','—','Unavailable: no verified system state for this example']].map(([label,value,note])=>`<div class="example-metric"><div class="label">${label}</div><div class="value">${value}</div><div class="objective">${note}</div></div>`).join('')}</div></div><p class="objective">Template only; no strategy, order activity, or performance claims are represented.</p></article>`}
function renderTrading(data){const lanes=Array.isArray(data?.lanes)?data.lanes:[];const count=lanes.length;const statuses=[["Strategies",String(count),count?"Verified canonical lane count":"No canonical promoted lanes"],["Capital","—","Unavailable: no verified capital value"],["Total Return","—","Unavailable: no verified return value"],["System",count?"Status unavailable":"Awaiting promotion",count?"No verified system state":"No canonical promoted lanes"]];return `<section class="trading-heading"><h1>Trading</h1><p>Live and paper activity is shown only when backed by canonical promoted-lane data.</p></section><section class="tiles">${statuses.map(([label,value,note])=>`<div class="tile"><div class="label">${label}</div><div class="value ${label==='System'&&!count?'cyan status-text':''}">${esc(value)}</div><div class="objective">${esc(note)}</div></div>`).join('')}</section>${count?lanes.map(lane=>`<article class="card"><h2>${esc(lane.display_name)}</h2><div class="meta">${esc(lane.lane_id)}</div><div class="objective">Promoted lane record. Stage-specific status is only shown when present in verified data.</div></article>`).join(''):`<article class="card empty-state"><div class="lock-icon" aria-hidden="true">⌑</div><h2>No Active Strategies</h2><p>There are no canonical promoted strategies available for trading. Research results are not active strategies and are not trading performance.</p><a class="button" href="${BASE}/research" onclick="event.preventDefault();navigate('research')">Go to Research →</a></article>`}${renderTemplate()}`}
function selectLaneStage(stage){if(!LANE_STAGES.some(([key])=>key===stage))return;laneStageSelection=stage;document.getElementById('view').innerHTML=renderTrading(trading||{lanes:[]})}
function renderRouteError(name,message){return `<article class="card empty error" role="status"><h2>${name} unavailable</h2><p>${esc(message)}</p></article>`}
async function loadRoute(target=currentRoute()){if(!TOKEN)return;route=target==='trading'?'trading':'research';const requestRoute=route,generation=++requestGeneration;if(activeRequest)activeRequest.abort();const controller=new AbortController();activeRequest=controller;document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('active',a.dataset.route===requestRoute));try{const endpoint=requestRoute==='trading'?'/api/dashboard/trading':'/api/dashboard/research';const response=await api(endpoint,{signal:controller.signal});if(!response.ok)throw Error(`Request failed (${response.status})`);const data=await response.json();if(generation!==requestGeneration)return;if(requestRoute==='trading'){trading=data;document.getElementById('view').innerHTML=renderTrading(data)}else{research=data;document.getElementById('view').innerHTML=renderResearch(data)}}catch(e){if(generation===requestGeneration&&e.name!=='AbortError'&&TOKEN)document.getElementById('view').innerHTML=renderRouteError(requestRoute==='trading'?'Trading':'Research',e.message)}finally{if(generation===requestGeneration)activeRequest=null}}
if(TOKEN){showApp();route=currentRoute();loadRoute(route)}setInterval(()=>{if(TOKEN)loadRoute(currentRoute())},120000);
function experimentDate(id){const m=/^(\d{4})(\d{2})(\d{2})_/.exec(String(id??""));if(!m)return"—";const year=Number(m[1]),month=Number(m[2]),day=Number(m[3]),date=new Date(Date.UTC(year,month-1,day));if(date.getUTCFullYear()!==year||date.getUTCMonth()!==month-1||date.getUTCDate()!==day)return"—";return date.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric",timeZone:"UTC"})}
function renderResearch(data){
 const c=data.champion,n=data.counts||{},a=data.activity||{},recent=Array.isArray(data.recent)?data.recent.slice(0,5):[];
 const state=a.state==='active'?'OK':(a.state||'unknown').toUpperCase(),running=a.state==='active';
 const rows=recent.length?recent.map(r=>`<tr><td>${esc(r.experiment_id)}</td><td>${esc(experimentDate(r.experiment_id))}</td><td>${esc(pct(r.development_annual_return))}</td></tr>`).join(''):'<tr><td colspan="3" class="empty">No recent experiments.</td></tr>';
  const range=c?`${esc(c.development_start)} through ${esc(c.development_end)}`:'—';
  const experimentTable=`<section class="research-table"><h3>Recent Experiments</h3><div class="meta">Latest results · standard Annual return</div><table class="table"><thead><tr><th>ID</th><th>Date</th><th>Annual return</th></tr></thead><tbody>${rows}</tbody></table></section>`;
 return `<section class="research-heading"><h1>Research</h1><p>AI-driven strategy discovery for long-term wealth.</p></section>
 <section class="tiles">
  <div class="tile"><div class="label">System</div><div class="value ${running?'green':''}">${esc(state)}${running?'<span class="status-dot" aria-hidden="true"></span>':''}</div><div class="objective">${running?'Research running':a.state==='sleeping'?'Research sleeping':'Status unavailable'}</div></div>
  <div class="tile"><div class="label">Return metric</div><div class="value cyan">Annual return</div><div class="objective">Standard compounded annual growth</div></div>
  <div class="tile"><div class="label">Best Annual return</div><div class="value green">${c?esc(pct(c.annual_return)):'—'}</div><div class="objective">${c?range:'No champion available'}</div></div>
  <div class="tile"><div class="label">Experiments</div><div class="value">${esc(n.valid_attempts??0)}</div><div class="objective">Valid research attempts</div></div>
 </section>
  <article class="card"><div class="champ-head"><div><h2>Research Champion</h2><div class="meta">${c?`${esc(c.experiment_id)} · ${esc(String(c.candidate_sha256??'').slice(0,12))}`:'No verified champion data available'}</div></div><span class="template-badge">DEVELOPMENT</span></div>
   <div class="metrics"><span><strong>Annual return</strong> ${c?esc(pct(c.annual_return)):'—'}</span><span><strong>Sharpe</strong> ${c?esc(ratio(c.sharpe)):'—'}</span><span><strong>Max Drawdown</strong> ${c?esc(pct(c.max_drawdown)):'—'}</span><span><strong>Ending Equity</strong> ${c?esc(money(c.ending_equity)):'—'}</span><span><strong>Data Window</strong> ${range}</span></div>
   ${chart(data.chart||{})}${experimentTable}${c?`<details class="objective"><summary>Champion audit identity</summary><div>Candidate SHA-256: <code>${esc(c.candidate_sha256)}</code> · Dataset manifest SHA-256: <code>${esc(c.dataset_manifest_sha256)}</code></div></details><details class="objective"><summary>Five-year historical replay</summary>${fiveYearReplay(data.chart,c.development_end)}</details>`:''}</article>`
}
