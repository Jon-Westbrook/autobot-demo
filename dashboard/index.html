/* Design pass: quiet surfaces, one accent, more air. Later rules refine the ones above. */
:root{--green:var(--cyan);--red:#f0838f;--line:rgba(148,178,204,.16);--line-soft:rgba(148,178,204,.08);--muted:#8496ab;--muted-2:#b6c3d2;--reference:#97a6b8}
body{background:radial-gradient(1100px 520px at 50% -12%,rgba(0,231,244,.075),transparent 62%),#04080d;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.kpi-value,.axis-y,.axis-x,.plot-tip,.table td,.leader-metrics strong,.metrics span span,.spark small{font-variant-numeric:tabular-nums}
body:before{display:none}
#app{padding-bottom:72px}.topbar{border-bottom:0;margin-bottom:36px}.demo-flag{color:var(--muted-2)}
.card,.tile{background:rgba(255,255,255,.022);border:1px solid var(--line-soft);border-radius:16px;box-shadow:none}.card{padding:28px;margin-bottom:20px}
.research-heading{margin-bottom:32px}.research-heading h1{font-size:36px;letter-spacing:-.03em}.research-heading p{max-width:660px;font-size:16px;line-height:1.6;color:var(--muted-2);margin-top:10px}
.section-heading{font-size:22px;letter-spacing:-.02em;margin:64px 0 8px}.section-intro{max-width:660px;margin:0 0 24px;color:var(--muted);font-size:14px;line-height:1.6}
.template-badge{border-color:rgba(0,231,244,.4);font-weight:600;letter-spacing:.08em}.template-badge.warn-badge{border-color:var(--line);color:var(--muted-2)}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan)}

.hero-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:24px}.hero-head h2{font-size:24px;letter-spacing:-.02em;margin:8px 0 6px}.hero-meta{margin:0;color:var(--muted);font-size:13px;line-height:1.55}
