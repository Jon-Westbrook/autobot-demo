 <div id="app"><header class="topbar"><a class="brand-lockup" href="/" aria-label="Autobot Growth Research"><span class="brand">AUTOBOT</span><span class="brand-caption">Growth Research</span></a><nav class="nav" aria-label="Primary"><a href="/research" data-route="research">Research</a><a href="/trading" data-route="trading">Trading</a><button class="refresh-button" id="refresh-button" type="button" aria-label="Check for the latest research leader and refresh replay charts">Refresh</button><span class="refresh-status" id="refresh-status" aria-live="polite"></span></nav></header><main id="view"></main></div>
<script>
const BASE='__AUTOBOT_BASE_PATH__';let route='research',renderedRoute=null,research=null,trading=null,requestGeneration=0,activeRequest=null,manualRefreshPending=false;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function api(path,options={}){return fetch(BASE+path,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}})}
function currentRoute(){return location.pathname.endsWith('/trading')?'trading':'research'}
function navigate(next){const url=BASE+(next==='trading'?'/trading':'/research');history.pushState({},'',url);loadRoute(next)}
document.querySelector('.brand-lockup').href=BASE+'/';document.querySelectorAll('.nav a').forEach(a=>a.href=BASE+'/'+a.dataset.route);
document.querySelectorAll('.nav a').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();navigate(a.dataset.route)}));document.getElementById('refresh-button').addEventListener('click',refreshDashboard);window.addEventListener('popstate',()=>{route=currentRoute();loadRoute()});
const money=v=>{if(v==null)return '—';const number=Number(v);if(!Number.isFinite(number))return '—';return number!==0&&(Math.abs(number)<1||Math.abs(number)>=1e15)?'$'+number.toExponential(2):number.toLocaleString('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0})};
const pct=v=>v==null?'—':(Number(v)*100).toFixed(2)+'%';const ratio=v=>v==null?'—':Number(v).toFixed(2);
const equityNumber=value=>{if(typeof value==='number')return Number.isFinite(value)&&value>0?value:null;if(typeof value!=='string'||! /^[+-]?(?:[0-9]+(?:\.[0-9]*)?|\.[0-9]+)(?:[eE][+-]?[0-9]+)?(?![\s\S])/.test(value))return null;const number=Number(value);return Number.isFinite(number)&&number>0?number:null};
function chartPoint(svg,index){
 const points=JSON.parse(svg.getAttribute("data-points")||"[]");
 if(!points.length)return;
 const i=Math.max(0,Math.min(points.length-1,index)),point=points[i],group=svg.parentNode.querySelector(".chart-inspection");
 if(!group)return;
 const crosshair=group.querySelector(".chart-crosshair"),marker=group.querySelector(".chart-point"),background=group.querySelector(".chart-tip-bg");
 crosshair.setAttribute("x1",point.x);crosshair.setAttribute("x2",point.x);
 marker.setAttribute("cx",point.x);marker.setAttribute("cy",point.y===null?16:point.y);marker.setAttribute("visibility",point.y===null?"hidden":"visible");
  const tipX=point.x>530?point.x-270:point.x+8;background.setAttribute("x",tipX);
 group.querySelector(".chart-tip-date").setAttribute("x",tipX+8);group.querySelector(".chart-tip-date").textContent=point.date;
  const value=point.equity===null?"Equity unavailable (missing mark)":(point.equity!==0&&(Math.abs(point.equity)<1||Math.abs(point.equity)>=1e15)?"$"+point.equity.toExponential(2):point.equity.toLocaleString("en-US",{style:"currency",currency:"USD",maximumFractionDigits:2}));
  group.querySelector(".chart-tip-equity").setAttribute("x",tipX+8);group.querySelector(".chart-tip-equity").textContent=value;
  const reference=point.benchmarkSymbol?`${point.benchmarkSymbol} buy & hold: ${point.benchmark==null?"Equity unavailable (missing mark)":money(point.benchmark)}`:"No reporting reference selected";
  const benchmarkTip=group.querySelector(".chart-tip-benchmark");if(benchmarkTip){benchmarkTip.setAttribute("x",tipX+8);benchmarkTip.textContent=reference}
  group.setAttribute("visibility","visible");svg.setAttribute("data-index",String(i));svg.setAttribute("aria-valuenow",String(i));svg.setAttribute("aria-valuetext",`${point.date}, strategy ${value}, ${reference}`);
  const host=svg.closest?.(".chart")||svg.parentNode,live=host.querySelector(".chart-tooltip");if(live){live.textContent=`${point.date} · Strategy: ${value} · ${reference}`;live.hidden=false}
}
function chartPointer(event,svg){const box=svg.ownerSVGElement.getBoundingClientRect(),x=(event.clientX-box.left)/box.width*960,left=Number(svg.getAttribute("data-left"))||78,right=Number(svg.getAttribute("data-right"))||18;const points=JSON.parse(svg.getAttribute("data-points")||"[]");chartPoint(svg,Math.round((x-left)/(960-left-right)*(points.length-1)))}
function chartLeave(svg){if(document.activeElement!==svg){const group=svg.parentNode.querySelector(".chart-inspection");if(group)group.setAttribute("visibility","hidden");const live=(svg.closest?.(".chart")||svg.parentNode).querySelector(".chart-tooltip");if(live)live.hidden=true}}
function chartKey(event,svg){if(!["ArrowLeft","ArrowRight","Home","End"].includes(event.key))return;event.preventDefault();const points=JSON.parse(svg.getAttribute("data-points")||"[]"),current=Number(svg.getAttribute("data-index"))||0;chartPoint(svg,event.key==="Home"?0:event.key==="End"?points.length-1:current+(event.key==="ArrowRight"?1:-1))}
const chartScales={};const replaySeries={};const benchmarkSelections={};
function setChartScale(key,scale){chartScales[key]=scale;const host=document.getElementById(`plot-${key}`);if(host&&replaySeries[key])host.innerHTML=chart(replaySeries[key],scale)}

const multiple=v=>v==null||!Number.isFinite(Number(v))?'—':`${Number(v).toFixed(2)}×`;
const holding=minutes=>{if(minutes==null||!Number.isFinite(Number(minutes)))return'—';const m=Number(minutes);return m<120?`${Math.round(m)} min`:m<2880?`${(m/60).toFixed(1)} h`:`${(m/1440).toFixed(1)} days`};
const SERVICE_BADGES={active:['ACTIVE','research-badge'],stopped:['STOPPED','warn-badge'],error:['ERROR','error-badge'],unknown:['UNKNOWN','warn-badge']};
function researchTable(title,meta,headers,rows,empty){return `<article class="card research-table"><div class="research-table-head"><div><h3>${esc(title)}</h3><div class="meta">${esc(meta)}</div></div></div><table class="table"><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.join(''):`<tr><td colspan="${headers.length}" class="empty">${esc(empty)}</td></tr>`}</tbody></table></article>`}
// One card shell for every active lab; the headline follows the lab's own objective and
// the rest is whatever that lab publishes cheaply (champion summary, results, supervisor state).
const RUNNER_BADGES={active:['RUNNING','research-badge'],sleeping:['SLEEPING','warn-badge']};
const sinceUntil=(start,end)=>{const a=Date.parse(start),b=Date.parse(end);if(!Number.isFinite(a)||!Number.isFinite(b)||b<a)return'';const m=Math.round((b-a)/60000);return m<60?`${m} min`:`${Math.floor(m/60)}h ${m%60}m`};
function runnerDetails(lab){
 const r=lab.runner;if(!r)return`<div class="meta">Supervisor state not published.</div>`;
 const now=lab.service!=='active'?`Supervisor ${String(lab.service||'unknown').toUpperCase()}`:r.mode==='sleeping'?`Sleeping after cycle ${count(r.cycle)} · wakes ${activityTime(r.wake_at)} (${wakeCountdown(r.wake_at)})`:r.mode==='active'?`Running cycle ${count(r.cycle)} · started ${whenAgo(r.cycle_started_at)}`:`Mode ${r.mode||'unknown'}`;
 const c=r.last_cycle,last=c?`Cycle ${count(c.cycle)} · ${count(c.experiments)} experiments · ${count(c.keeps)} keeps · ${count(c.failures)} failures · ${String(c.stop_reason||'no stop reason').replaceAll('_',' ')} · ${activityTime(c.started_at)} → ${activityTime(c.ended_at)}${sinceUntil(c.started_at,c.ended_at)?` (${sinceUntil(c.started_at,c.ended_at)})`:''}`:'No completed cycle yet';
 const streak=r.provider_failure_streak?`<div><dt>Provider failure streak</dt><dd class="leader-warning">${esc(count(r.provider_failure_streak))} cycles with no experiments</dd></div>`:'';
 return `<dl class="details-grid lane-runner"><div><dt>Supervisor now</dt><dd>${esc(now)}</dd></div><div><dt>Last completed cycle</dt><dd>${esc(last)}</dd></div><div><dt>Cycles completed</dt><dd>${esc(count(r.completed_cycles))}</dd></div><div><dt>Model</dt><dd>${esc([r.model,r.variant].filter(Boolean).join(' · ')||'—')}</dd></div>${streak}</dl>`
}
function laneCard(lab){
 const [badge,tone]=SERVICE_BADGES[lab?.service]||SERVICE_BADGES.unknown,name=esc(lab?.display_name||lab?.lab||'Research lab');
 const [runBadge,runTone]=lab?.service==='active'&&RUNNER_BADGES[lab?.runner?.mode]||[];
 const head=`<div class="champion-title"><h2>${name}</h2><div class="lane-badges">${runBadge?`<span class="template-badge ${runTone}">${runBadge}</span>`:''}<span class="template-badge ${tone}">${badge}</span></div></div>`;
 if(!lab?.available)return `<article class="card lane-card">${head}<div class="meta leader-warning">${esc(lab?.error||'Data temporarily unavailable')}</div><div class="empty">Current best not shown until the lab's published files read cleanly.</div>${lab?.runner!==undefined?runnerDetails(lab):''}</article>`;
 const b=lab.best||{},n=lab.counts||{},w=lab.window||{},latest=lab.latest,fast=lab.kind==='active';
 const metric=(label,value,tone='')=>`<span class="metric-${tone}"><strong>${esc(label)}</strong><span>${esc(value)}</span></span>`;
 const sw=b.score_window;
 const headline=fast?`<div><span>Best growth multiple</span><strong>${esc(multiple(b.growth_multiple))}</strong></div><div><span>Capital · search window</span><strong class="equity-path">${esc(money(b.starting_capital))} → ${esc(money(b.final_equity))}</strong><small>${esc(b.total_return==null?'':`${pct(b.total_return)} total return`)}</small></div>`
  :`<div><span>Best Annual return${sw?` · ${esc(sw.start)} → ${esc(sw.end)}`:''}</span><strong>${esc(pct(b.annual_return))}</strong></div><div><span>Implied growth · same window</span><strong class="equity-path">${b.implied_final_equity==null?'—':`${esc(money(b.starting_capital))} → ${esc(money(b.implied_final_equity))} (${esc(multiple(b.implied_growth_multiple))})`}</strong><small>Compounded from the Annual return; the lab publishes no equity curve</small></div>`;
 const research=[metric('Experiments',count(n.experiments)),metric('Keeps',count(n.keeps),'green'),metric('Discards',count(n.discards)),metric('Failures',count(n.failures),n.failures?'red':'')];
 const inMarket=b.sessions?`${pct(b.sessions_with_position/b.sessions)} (${count(b.sessions_with_position)}/${count(b.sessions)})`:'—';
 const frequency=b.frequency_qualified==null?[]:[metric('Trades / session',b.closed_trades_per_session==null?'—':`${Number(b.closed_trades_per_session).toFixed(2)} (min ${b.frequency_threshold_trades_per_session??'—'})`),metric('Qualified winner',b.qualified_winner?'Yes':'No',b.qualified_winner?'green':'red')];
 const strategy=fast?[metric('Trades',count(b.closed_trades)),metric('Win rate',b.win_rate==null?'—':`${pct(b.win_rate)} (${count(b.winning_trades)}/${count(b.closed_trades)})`),metric('Costs',money(b.cost_dollars)),metric('Mean holding',holding(b.mean_holding_minutes)),metric('Max drawdown',pct(b.max_drawdown),'red'),metric('Sessions in market',inMarket),metric('Forced exits',count(b.forced_exits)),...frequency]
  :[metric('Max drawdown',pct(b.max_drawdown),'red'),metric('Avg gross exposure',pct(b.average_gross_exposure)),metric('Sessions',count(b.sessions)),metric('Inputs / targets',`${count(b.signal_inputs)} / ${count((b.tradable_targets||[]).length)}`),metric('Partial-fill rate',b.partial_fill_rate==null?'—':pct(b.partial_fill_rate))];
 const assets=Object.entries(b.asset_use||{}).map(([symbol,uses])=>`${symbol} ${uses}`).join(' · ');
 const latestText=latest?.experiment_id?`${latest.experiment_id} · ${String(latest.status||'—').toUpperCase()}${latest.experiment_id===b.experiment_id?' (current best)':''}`:'—';
 const details=`<dl class="details-grid"><div><dt>Best experiment</dt><dd><code>${esc(b.experiment_id||'—')}</code></dd></div><div><dt>Best found</dt><dd>${esc(b.experiment_id==='neutral_seed'?'neutral seed (no keep yet)':whenAgo(b.found_at))}</dd></div><div><dt>Latest experiment</dt><dd><code>${esc(latestText)}</code></dd></div><div><dt>Last activity</dt><dd>${esc(whenAgo(lab.last_activity_at))}</dd></div>${fast?`<div><dt>Assets traded (entries)</dt><dd>${esc(assets||'—')}</dd></div>`:`<div><dt>Tradable targets</dt><dd>${esc((b.tradable_targets||[]).join(' · ')||'—')}</dd></div>`}</dl>`;
 const regimes=!fast&&Array.isArray(b.regimes)&&b.regimes.length?`<div class="regime-results">${b.regimes.map(r=>`<div><span>${esc(r.label||r.key)} · excess Annual return</span><strong class="${Number(r.excess_annual_return)>=0?'positive':'negative'}">${esc(pct(r.excess_annual_return))}</strong></div>`).join('')}</div>`:'';
 return `<article class="card lane-card">${head}<div class="meta">${esc((w.label||'In-sample').toUpperCase())} · ${esc(w.start||'—')} → ${esc(w.end||'—')}</div><div class="leader-metrics">${headline}</div><div class="metrics">${[...strategy,...research].join('')}</div>${regimes}${details}${runnerDetails(lab)}</article>`
}
// Labs V2: one table per population, every trajectory including paused and frozen ones.
const POPULATION_STATES={fresh:'FRESH',repair:'REPAIR',mature:'MATURE',paused:'PAUSED',frozen:'FROZEN'};
const dutyText=d=>Array.isArray(d)&&d.length===2?`${d[0]}m on / ${d[1]}m off`:'—';
function populationSection(p){
 const fast=p.kind==='active',pol=p.policy||{},duty=pol.duty||{};
 const meta=`${pol.enabled===false?'Auto-growth OFF':'Auto-growth ON'} · ${count(pol.fresh_slots)} fresh slot (${dutyText(duty.fresh)}) · ${count(pol.mature_slots)} mature slots (${dutyText(duty.mature)}) · demoted after ${count(pol.demote_after_no_keep)} experiments without a keep · in-sample search figures only`;
 const rows=(p.members||[]).map(m=>{const b=m.best||{},state=POPULATION_STATES[m.state]||String(m.state||'—').toUpperCase();
  const best=!m.available?'—':fast?multiple(b.growth_multiple):pct(b.annual_return);
  const sibling=(p.members||[]).find(o=>o.lab===m.closest),closest=m.max_similarity==null?'—':`${Math.round(m.max_similarity*100)}% like ${sibling?.trajectory||m.closest||'—'}`;
  return `<tr class="${m.state==='fresh'?'champ-row':''}"><td>${esc(m.trajectory||m.lab)}${m.parent?`<div class="meta">from ${esc(m.parent)}</div>`:''}</td><td>${esc(state)}${m.keep_while_mature?' <span class="state-flag">· NEW KEEP</span>':''}</td><td>${esc(count(m.since_last_keep))}</td><td>${esc(count(m.counts?.experiments))}</td><td>${esc(count(m.counts?.keeps))}</td><td>${esc(best)}</td><td class="text-cell">${esc(closest)}</td><td class="text-cell">${(m.family||[]).length?m.family.map(esc).join('<br>'):'—'}</td></tr>`});
 const log=(p.log||[]).map(e=>`<tr><td>${esc(activityTime(e.at))}</td><td>${esc(String(e.action||'').replaceAll('_',' '))}</td><td>${esc(e.lab||'—')}</td><td class="text-cell">${esc([e.state,e.reason].filter(Boolean).join(' · ')||'—')}</td></tr>`);
 return `<div class="population-scroll">${researchTable(`${p.display_name} population`,meta,['Trajectory','State','Since last keep','Experiments','Keeps',fast?'Best growth':'Best Annual return','Closest sibling','Family'],rows,'No trajectories yet.')}</div><div class="population-scroll">${researchTable(`${p.display_name} population log`,'Latest automatic and manual population actions, newest first',['When','Action','Trajectory','Detail'],log,'No population actions yet.')}</div>`
}
function renderPopulations(populations){
 return Array.isArray(populations)&&populations.length?`<section class="population-tables">${populations.map(populationSection).join('')}</section>`:'';
}
function renderResearchLabs(labs){
 if(!Array.isArray(labs))return `<section class="lane-cards"><article class="card lane-card"><div class="empty">Research lab status unavailable.</div></article></section>`;
 const bests=labs.filter(lab=>lab?.available).flatMap(lab=>(lab.recent_bests||[]).map(row=>({...row,lab})));
 bests.sort((a,b)=>(Date.parse(b.at)||0)-(Date.parse(a.at)||0));
 const rows=bests.map(r=>{const fast=r.lab.kind==='active',current=r.experiment_id===r.lab.best?.experiment_id;return `<tr class="${current?'champ-row':''}"><td>${current?'★ ':''}${esc(r.lab.display_name)}</td><td>${esc(activityTime(r.at))}</td><td><code>${esc(r.experiment_id)}</code></td><td>${esc(fast?`${multiple(r.growth_multiple)} · ${money(r.final_equity)}`:`${pct(r.annual_return)} Annual return`)}</td><td>${esc(fast?`${count(r.closed_trades)} trades`:`${pct(r.max_drawdown)} DD`)}</td></tr>`});
 return `<section class="lane-cards">${labs.map(laneCard).join('')}</section>${researchTable('Recent Bests','Kept experiments (each a new lab champion), newest first · in-sample search figures only · ★ marks each lab\'s current best',['Lab','Found','Experiment','Annual return / Growth','Drawdown / Trades'],rows,'No kept experiments yet.')}`
}
function renderResearch(data){
  const c=data.leader,n=data.counts||{},a=data.activity||{},recent=Array.isArray(data.recent)?data.recent.slice(0,5):[],replay=data.historical_replay;
  const state=a.state==='active'?'RUNNING':(a.state||'unknown').toUpperCase(),running=a.state==='active',unavailable=leaderUnavailable(data),cycleHint=unavailable&&a.state==='active'&&/identity_mismatch/.test(data.leader_status?.detail||'')?' · expected while an active research cycle is editing the candidate':'';
  const processDetail=a.state==='sleeping'?`Cycle ${esc(a.cycle??'—')} · sleeping since ${esc(activityTime(a.sleep_started_at))} · wakes ${esc(activityTime(a.wake_at))} (${esc(wakeCountdown(a.wake_at))})`:a.state==='active'?`Cycle ${esc(a.cycle??'—')} · started ${esc(activityTime(a.cycle_started_at))} · heartbeat ${esc(activityTime(a.heartbeat))}`:a.state==='stopped'?`Stopped ${esc(activityTime(a.heartbeat))}${a.stop_reason?` · ${esc(a.stop_reason)}`:''}`:a.state==='stale'?`Last heartbeat ${esc(activityTime(a.heartbeat))}${a.last_mode?` · runner last reported ${esc(a.last_mode)}`:''}`:'Heartbeat unavailable';
  const developmentPeriod=replay?.periods?.development,developmentMetrics=developmentPeriod?.metrics||{},sessionTotal=Array.isArray(developmentPeriod?.points)?developmentPeriod.points.length:null;
  const windowDetail=sessionTotal===null?'Waiting for verified current-leader replay':`${esc(developmentMetrics.start_date||'—')} → ${esc(developmentMetrics.end_date||'—')} · ${esc(windowYears(developmentMetrics.start_date,developmentMetrics.end_date)||'—')} · ${esc(developmentMetrics.priced_sessions??'—')} priced / ${esc(developmentMetrics.missing_marks??'—')} missing`;
  const completedCycles=a.completed_cycles??'—',cycleDetail=a.state==='active'?`Cycle ${a.cycle??'—'} is running`:a.state==='sleeping'?`Cycle ${a.cycle??'—'} is sleeping`:a.state==='stopped'?`Last cycle ${a.cycle??'—'}`:'Recent completed cycles',lastCycle=a.last_cycle||{},lastCycleTitle=`Cycle ${lastCycle.cycle??'—'} · ${cycleStopReason(lastCycle)}`,lastCycleRange=lastCycle.started_at||lastCycle.ended_at?`${activityTime(lastCycle.started_at)} – ${activityTime(lastCycle.ended_at)}`:'Dates and times unavailable';
 const rows=recent.map((r,i)=>`<tr class="${c&&r.experiment_id===c.experiment_id?'champ-row':''}"><td title="Experiment ID: ${esc(r.experiment_id)}"><span class="run-index">${c&&r.experiment_id===c.experiment_id?'★ ':''}${String(i+1).padStart(2,'0')}</span></td><td>${esc(experimentDate(r.experiment_id))}</td><td><span class="run-status ${esc(String(r.status||'').toLowerCase())}">${esc(String(r.status||'—').toUpperCase())}</span></td><td>${esc(pct(r.development_annual_return))}</td></tr>`);
  const leaderLabel=c?.leader_type==='qualified'?'QUALIFIED CHAMPION · 4/4 REGIMES':c?.leader_type==='provisional'?'PROVISIONAL':c?'CURRENT LEADER':unavailable?'VERIFICATION UNAVAILABLE':'NO CURRENT V4 LEADER';
  const scoreWindow=c?.score_window?.start&&c?.score_window?.end?`${c.score_window.start} → ${c.score_window.end}`:'score window unavailable';
  const championDetails=c?`<div class="leader-metrics"><div><span title="The v4 objective: candidate Annual return over the evaluator's score window">Score Annual return · ${esc(scoreWindow)}</span><strong>${pct(c.development_annual_return)}</strong></div><div><span>Regimes passed</span><strong>${esc(c.regimes_passed)}/4</strong></div></div><div class="regime-results">${(c.regime_results||[]).map(r=>`<div><span>${esc(r.label||r.key)}</span><strong class="${r.qualifies?'positive':'negative'}">${pct(r.excess_annual_return)} excess Annual return vs modeled cash · ${r.qualifies?'PASS':'FAIL'}</strong></div>`).join('')}</div>${c.weakest_regime?`<div class="weakest-regime">Weakest regime · ${esc(c.weakest_regime.label||c.weakest_regime.key)} · ${pct(c.weakest_regime.excess_annual_return)} excess Annual return vs modeled cash</div>`:''}<details class="champion-details"><summary>Leader identity</summary><dl class="details-grid"><div><dt>Candidate ID</dt><dd><code>${esc(c.experiment_id)}</code></dd></div><div><dt>Candidate SHA-256</dt><dd><code>${esc(c.candidate_sha256||'—')}</code></dd></div><div><dt>Evaluator</dt><dd>${esc(c.evaluator_version||'—')}</dd></div></dl></details>`:'';
 return `<section class="research-heading"><div><h1>Research</h1><p>Self-growing research populations · every trajectory's current best, read live from each lab's published results on every refresh</p></div></section>
   ${renderPopulations(data.populations)}${renderResearchLabs(data.labs)}
   <h2 class="section-heading">Archived lab · Growth Regime Model v4</h2><p class="tile-method">The previous single-lab search. It is not one of the active labs above; its verified leader and replay evidence remain here and on Trading.</p>
   <section class="tiles"><div class="tile"><div class="label">Process</div><div class="value ${running?'green':''}">${esc(state)}${running?'<span class="status-dot" aria-hidden="true"></span>':''}</div><div class="tile-detail">${processDetail}</div></div><div class="tile" title="${esc(data.count_semantics?.valid_attempts||'Summary-matched current-evaluator attempts with current pins')}"><div class="label">V4 Experiments</div><div class="value">${esc(n.valid_attempts??'—')}</div><div class="tile-detail">Current evaluator · pinned summaries</div></div><div class="tile" title="${esc(data.count_semantics?.scored||'Valid attempts with a finite objective score')}"><div class="label">Scored</div><div class="value cyan">${esc(n.scored??'—')}</div><div class="tile-detail">Finite objective score available</div></div><div class="tile"><div class="label">Research Cycles</div><div class="value">${esc(completedCycles)}</div><div class="tile-detail">${esc(cycleDetail)}</div></div><div class="tile"><div class="label">Development Window</div><div class="value">${sessionTotal===null?'—':Number(sessionTotal).toLocaleString('en-US')} sessions</div><div class="tile-detail">${windowDetail}</div></div><div class="tile" title="${esc(lastCycleTitle)}"><div class="label">Last Active Cycle</div><div class="value">${lastCycle.experiments_completed==null?'—':`${esc(lastCycle.experiments_completed)} experiments`}</div><div class="tile-detail">${esc(lastCycleRange)} · ${lastCycle.elapsed_seconds==null?'Duration unavailable':esc(cycleDuration(lastCycle.elapsed_seconds))} · ${esc(cycleStopReason(lastCycle))}</div></div></section><p class="tile-method">Experiments and scores count summary-matched v4 ledger rows with current evaluator, contract, and dataset pins. Last-cycle activity comes from the runner’s completed-cycle record; times are shown in your local timezone. A provider/model label is not proof of a subscription quota.</p>
   <article class="card champion-card"><div class="champ-head"><div><div class="champion-title"><h2>Current Research Leader</h2><span class="template-badge research-badge${unavailable?' warn-badge':''}">${esc(leaderLabel)}</span></div><div class="champion-name${unavailable?' leader-warning':''}">${c?`Candidate ${esc(c.experiment_id)}`:unavailable?esc(unavailable+cycleHint):'No current v4 leader'}</div></div></div>${championDetails}</article>
 ${replayCard(replay,'development','Development Replay','',true)}${replayCard(replay,'five_year','Five-Year Replay','',false)}${replayCard(replay,'ten_year','Ten-Year Replay','',false)}${replayCard(replay,'through_present','Through-Present / Full-History Replay','',false)}
 ${researchTable('Recent Experiments','Latest summary-matched v4 attempts, newest first · development-window Annual return only, no post-selection replay values · ★ marks the current leader',['Run','Date','Status','Development Annual return'],rows,'No recent experiments.')}`
}
</script></body></html>
