<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autobot Growth</title>
<style>
  :root {
    --bg: #0b0f14; --panel: #121822; --panel-2: #172030; --line: #222e42;
    --text: #e6edf6; --muted: #8fa0b8; --accent: #00f0ff; --bench: #7c8aa0;
    --ok: #00e08a; --warn: #f0c000; --err: #ff5c7a;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
    padding: 18px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 17px; margin: 0; letter-spacing: .3px; }
  .spacer { flex: 1; }
  .muted { color: var(--muted); }
  .mono { font-family: var(--mono); }
  main { padding: 20px; max-width: 1180px; margin: 0 auto; }
  section { margin-bottom: 22px; }
  h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: 1.2px;
    color: var(--muted); margin: 0 0 10px; font-weight: 600;
  }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
  .tile { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
  .tile .label { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); }
  .tile .value { font-size: 20px; margin-top: 4px; font-family: var(--mono); }
  .tile .sub { font-size: 12px; color: var(--muted); margin-top: 2px; font-family: var(--mono); }
  .pill {
    display: inline-block; padding: 2px 9px; border-radius: 999px;
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .6px;
  }
  .pill.ok { background: rgba(0,224,138,.14); color: var(--ok); }
  .pill.degraded, .pill.idle { background: rgba(240,192,0,.14); color: var(--warn); }
  .pill.error { background: rgba(255,92,122,.14); color: var(--err); }
  table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 12.5px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .6px; }
  td.num, th.num { text-align: right; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 18px; font-size: 13px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; font-family: var(--mono); word-break: break-all; }
  .empty { color: var(--muted); font-style: italic; padding: 8px 0; }
  .chart-wrap { position: relative; }
  svg { display: block; width: 100%; height: 300px; }
  .legend { display: flex; gap: 16px; font-size: 12px; margin-top: 8px; color: var(--muted); }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; }
  #login { max-width: 320px; margin: 90px auto; }
  input, button {
    font: inherit; padding: 9px 12px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel-2); color: var(--text);
  }
  button { cursor: pointer; border-color: var(--accent); color: var(--accent); }
  button:hover { background: rgba(0,240,255,.08); }
  .err { color: var(--err); font-size: 13px; min-height: 18px; }
  code { background: var(--panel-2); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>

<div id="login" style="display:none">
  <div class="panel">
    <h1 style="font-size:16px;margin:0 0 4px">Autobot</h1>
    <p class="muted" style="margin:0 0 14px;font-size:13px">Enter access code</p>
    <input id="code" type="password" inputmode="numeric" autocomplete="off" style="width:100%">
    <button id="go" style="width:100%;margin-top:10px">Sign in</button>
    <p class="err" id="loginErr"></p>
  </div>
</div>

<div id="app" style="display:none">
  <header>
    <h1>Autobot <span class="muted">Growth</span></h1>
    <span id="overall" class="pill">-</span>
    <span class="muted mono" id="stage"></span>
    <span class="spacer"></span>
    <span class="muted mono" id="generated"></span>
  </header>
  <main>
    <section>
      <h2>Contract</h2>
      <div class="panel"><dl class="kv" id="contract"></dl></div>
    </section>
    <section>
      <h2>Canonical dataset</h2>
      <div class="panel"><dl class="kv" id="dataset"></dl></div>
    </section>
    <section>
      <h2>Research</h2>
      <div class="panel">
        <div class="grid" id="researchTiles"></div>
        <div class="chart-wrap" style="margin-top:18px">
          <svg id="curve" viewBox="0 0 1000 300" preserveAspectRatio="none"></svg>
          <div class="legend">
            <span><span class="swatch" style="background:var(--accent)"></span>best candidate</span>
            <span><span class="swatch" style="background:var(--bench)"></span>ASSET_A buy &amp; hold</span>
            <span class="mono" id="curveNote"></span>
          </div>
        </div>
      </div>
    </section>
    <section>
      <h2>Recent experiments</h2>
      <div class="panel"><table id="experiments"></table></div>
    </section>
    <section>
      <h2>Promoted lanes</h2>
      <div class="panel" id="lanes"></div>
    </section>
  </main>
</div>

<script>
const APP_BASE_PATH = '/autobot';
const TOKEN_KEY = 'autobot_token';
let TOKEN = localStorage.getItem(TOKEN_KEY);

function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json' };
  if (TOKEN) headers.Authorization = 'Bearer ' + TOKEN;
  return fetch(APP_BASE_PATH + path, { ...opts, headers: { ...headers, ...(opts.headers || {}) } })
    .then(response => {
      if (response.status === 401) {
        localStorage.removeItem(TOKEN_KEY);
        TOKEN = null;
        showLogin();
        throw new Error('unauthorized');
      }
      return response;
    });
}

const pct = (value, digits = 2) =>
  value === null || value === undefined ? '-' : (value * 100).toFixed(digits) + '%';
const num = (value, digits = 2) =>
  value === null || value === undefined || value === '' ? '-' : Number(value).toFixed(digits);
const text = (value) => (value === null || value === undefined || value === '' ? '-' : String(value));

function pill(level) {
  const safe = ['ok', 'degraded', 'error', 'idle'].includes(level) ? level : 'idle';
  return `<span class="pill ${safe}">${text(level)}</span>`;
}

function kv(target, pairs) {
  document.getElementById(target).innerHTML = pairs
    .map(([key, value]) => `<dt>${key}</dt><dd>${value}</dd>`).join('');
}

function tile(label, value, sub) {
  return `<div class="tile"><div class="label">${label}</div>` +
         `<div class="value">${value}</div>` +
         (sub ? `<div class="sub">${sub}</div>` : '') + `</div>`;
}

function renderCurve(curve) {
  const svg = document.getElementById('curve');
  const points = (curve && curve.points) || [];
  const note = document.getElementById('curveNote');
  if (points.length < 2) {
    svg.innerHTML = '';
    note.textContent = 'no scored candidate yet';
    return;
  }
  const W = 1000, H = 300, PAD = 8;
  const values = [];
  points.forEach(point => {
    if (point.equity) values.push(point.equity);
    if (point.benchmark) values.push(point.benchmark);
  });
  // Log scale: a decade of compounding is unreadable linearly.
  const lo = Math.log(Math.max(1e-9, Math.min(...values)));
  const hi = Math.log(Math.max(...values));
  const span = hi - lo || 1;
  const x = index => PAD + (index / (points.length - 1)) * (W - 2 * PAD);
  const y = value => H - PAD - ((Math.log(value) - lo) / span) * (H - 2 * PAD);
  const path = key => {
    let out = '', pen = false;
    points.forEach((point, index) => {
      const value = point[key];
      if (!value || value <= 0) { pen = false; return; }
      out += (pen ? 'L' : 'M') + x(index).toFixed(1) + ' ' + y(value).toFixed(1) + ' ';
      pen = true;
    });
    return out.trim();
  };
  svg.innerHTML =
    `<path d="${path('benchmark')}" fill="none" stroke="var(--bench)" stroke-width="1.4"/>` +
    `<path d="${path('equity')}" fill="none" stroke="var(--accent)" stroke-width="1.8"/>`;
  const stats = curve.stats || {};
  note.textContent = `${text(stats.start_date)} → ${text(stats.end_date)} · log scale · ` +
                     `${points.length} points`;
}

function renderExperiments(rows) {
  const table = document.getElementById('experiments');
  if (!rows || !rows.length) {
    table.innerHTML = '<tr><td class="empty">no experiments yet</td></tr>';
    return;
  }
  table.innerHTML =
    '<tr><th>experiment</th><th>candidate</th><th>stage</th><th>status</th><th class="num">score</th></tr>' +
    rows.map(row => `<tr>
        <td>${text(row.experiment_id)}</td>
        <td>${text(row.candidate_sha)}</td>
        <td>${text(row.stage)}</td>
        <td>${text(row.status)}</td>
        <td class="num">${row.score ? num(row.score, 4) : '-'}</td>
      </tr>`).join('');
}

function renderLanes(lanes) {
  const host = document.getElementById('lanes');
  if (!lanes || !lanes.length) {
    host.innerHTML = '<p class="empty">No lane promoted yet. Research is the active stage; ' +
                     'a lane appears here once a candidate passes validation and is promoted to Modeled.</p>';
    return;
  }
  host.innerHTML = '<table><tr><th>lane</th><th>contract</th><th>modeled</th><th>paper</th>' +
    '<th>live</th><th>health</th></tr>' +
    lanes.map(lane => `<tr>
        <td>${text(lane.display_name)}</td>
        <td>${text(lane.execution_contract)}</td>
        <td>${lane.modeled_enabled}</td>
        <td>${lane.paper_enabled}</td>
        <td>${lane.live_enabled}</td>
        <td>${pill(lane.health.level)}${(lane.health.issues || [])
              .map(issue => ` <span class="muted">${issue}</span>`).join('')}</td>
      </tr>`).join('') + '</table>';
}

function render(payload) {
  document.getElementById('generated').textContent = text(payload.generated_at);
  document.getElementById('overall').outerHTML =
    pill(payload.summary.health).replace('<span', '<span id="overall"');
  document.getElementById('stage').textContent =
    `stage ${text(payload.summary.stage)} · ${payload.summary.scored_experiments} scored experiments`;

  const contract = payload.contract || {};
  kv('contract', [
    ['status', pill(contract.health ? contract.health.level : 'idle')],
    ['id', `${text(contract.contract_id)} <span class="muted">v${text(contract.contract_version)}</span>`],
    ['document', contract.document_verified
      ? 'hash verified' : '<span style="color:var(--err)">HASH MISMATCH</span>'],
    ['signal window', text(contract.signal_window)],
    ['warmup', `${text(contract.warmup_observations)} observations, max gap ${text(contract.max_observation_gap)}`],
    ['ecosystem', (contract.ecosystem || []).map(item =>
      `<code>${item.symbol}</code>${item.signal_only ? '<span class="muted"> signal-only</span>' : ''}`).join(' ')],
  ]);

  const dataset = payload.dataset || {};
  const actions = dataset.corporate_actions || {};
  const cash = dataset.cash_rate || {};
  kv('dataset', [
    ['status', pill(dataset.health ? dataset.health.level : 'idle')],
    ['range', `${text(dataset.start)} → ${text(dataset.end)} <span class="muted">(${text(dataset.calendar)})</span>`],
    ['symbols', (dataset.symbols || []).map(symbol => `<code>${symbol}</code>`).join(' ')],
    ['manifest', `<span class="muted">${text(dataset.manifest_sha256)}</span>`],
    ['corporate actions', `${text(actions.splits)} splits, ${text(actions.dividends)} dividends ` +
      `<span class="muted">(${text(actions.provider)}, pay date: ${text(actions.pay_date_basis)})</span>`],
    ['minute source', `<span class="muted">${text(dataset.minute_source)}</span>`],
    ['INDEX_V', `<span class="muted">${text(dataset.index_source)} · boundary: ${text(dataset.index_provider_boundary)}</span>`],
    ['cash rate', `${text(cash.basis)} <span class="muted">via ${text(cash.reference_instrument)}, ` +
      `${text(cash.sessions_priced)} sessions</span>`],
  ]);

  const research = payload.research || {};
  const best = research.best || {};
  const benchmark = best.benchmark || {};
  document.getElementById('researchTiles').innerHTML = [
    tile('status', pill(research.health ? research.health.level : 'idle'),
         `${text(research.lab)} · ${text(research.evaluator_version)}`),
    tile('best score', best.score !== undefined && best.score !== null ? num(best.score, 4) : '-',
         `${text(best.stage)} · ${text(best.objective)}`),
    tile('Annual return', pct(best.annual_return), `ex cash ${pct(best.annual_return_ex_cash)}`),
    tile('max drawdown', pct(best.max_drawdown), `ASSET_A b&h ${pct(benchmark.max_drawdown)}`),
    tile('Sharpe', num(best.sharpe), `${text(best.scored_sessions)} scored sessions`),
    tile('experiments', `${text(research.experiment_count)}`,
         `${text(research.scored_experiment_count)} scored · ${text(research.distinct_candidate_count)} distinct`),
    tile('dependencies', (best.signal_inputs ? String(best.signal_inputs) : '-'),
         `targets ${best.tradable_targets ? best.tradable_targets.join(', ') : '-'}`),
    tile('data quality',
         `${pct(best.data_ineligibility_rate, 3)}`,
         `ineligible · partial fills ${pct(best.partial_fill_rate, 3)}`),
  ].join('');
  renderCurve(research.curve);
  renderExperiments(research.recent);
  renderLanes(payload.lanes);
}

function showLogin() {
  document.getElementById('login').style.display = 'block';
  document.getElementById('app').style.display = 'none';
}

async function load() {
  const response = await api('/api/dashboard');
  if (!response.ok) throw new Error('dashboard request failed');
  const payload = await response.json();
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  render(payload);
}

async function signIn() {
  const code = document.getElementById('code').value.trim();
  const response = await api('/api/auth', { method: 'POST', body: JSON.stringify({ code }) });
  const data = await response.json().catch(() => ({}));
  if (!response.ok || !data.token) {
    document.getElementById('loginErr').textContent = data.error || 'Invalid code';
    return;
  }
  TOKEN = data.token;
  localStorage.setItem(TOKEN_KEY, TOKEN);
  load().catch(error => { document.getElementById('loginErr').textContent = error.message; });
}

document.getElementById('go').addEventListener('click', signIn);
document.getElementById('code').addEventListener('keydown', event => {
  if (event.key === 'Enter') signIn();
});

if (TOKEN) {
  load().catch(() => showLogin());
} else {
  showLogin();
}
setInterval(() => { if (TOKEN) load().catch(() => {}); }, 120000);
</script>
</body>
</html>
