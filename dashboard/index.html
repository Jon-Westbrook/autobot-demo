<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Autobot</title><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box} :root{--bg:#090b12;--panel:#10131d;--line:#22293a;--cyan:#00f0ff;--green:#00ff88;--text:#e8eef7;--muted:#92a1b8}
body{margin:0;min-height:100vh;background:radial-gradient(circle at top,rgba(0,240,255,.07),transparent 35%),#090b12;color:var(--text);font:14px 'Courier New',monospace}
body:before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(rgba(0,240,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,240,255,.025) 1px,transparent 1px);background-size:40px 40px}
#login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}#login h1,.brand{font:900 30px Orbitron,sans-serif;letter-spacing:5px;color:var(--cyan);margin:0}input,button{font:inherit}#login input{padding:12px;border:1px solid var(--cyan);background:#0e1118;color:var(--cyan);text-align:center;letter-spacing:8px}button{cursor:pointer}
#app{display:none;max-width:1240px;margin:auto;padding:0 22px 50px}.topbar{height:88px;display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line);margin-bottom:22px}.brand{font-size:25px}.nav{height:100%;display:flex;align-items:center;gap:22px}.nav a{height:100%;display:flex;align-items:center;color:var(--muted);text-decoration:none;border-bottom:2px solid transparent;font-family:Orbitron,sans-serif;font-size:12px;letter-spacing:1px}.nav a.active,.nav a:hover{color:var(--cyan);border-color:var(--cyan)}.header-right{display:flex;align-items:center;gap:12px}.muted{color:var(--muted)}.button{background:transparent;border:1px solid var(--cyan);color:var(--cyan);padding:8px 13px;font:12px Orbitron,sans-serif;letter-spacing:1px}.button:disabled{opacity:.5}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:18px}.tile,.card{background:linear-gradient(180deg,rgba(16,19,29,.96),rgba(9,11,18,.96));border:1px solid rgba(34,41,58,.85);border-radius:10px}.tile{padding:14px}.label{font-size:10px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase}.value{font:700 22px Orbitron,sans-serif;margin-top:9px;overflow-wrap:anywhere}.cyan{color:var(--cyan)}.green{color:var(--green)}.card{padding:18px;margin-bottom:12px}.champ-head{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:start}.champ-head h2,.card h2{font:700 18px Orbitron,sans-serif;letter-spacing:1.5px;margin:0}.meta{color:var(--muted);font-size:12px;margin-top:8px;overflow-wrap:anywhere}.metrics{display:flex;gap:18px;flex-wrap:wrap;margin:16px 0;color:var(--muted)}.metrics strong{color:var(--text)}.objective{color:var(--muted);font-size:12px;margin-top:7px}.chart{border:1px solid var(--line);border-radius:8px;background:#090b12;margin-top:12px;padding:8px}.chart svg{display:block;width:100%;height:auto}.empty{padding:30px 12px;text-align:center;color:var(--muted);line-height:1.7}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{text-align:left;padding:9px 7px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}.table th{font-size:10px;color:var(--muted);letter-spacing:1px}.lane-tabs{display:flex;flex-wrap:wrap;gap:7px;margin:16px 0}.lane-tabs button{border:1px solid var(--line);background:transparent;color:var(--muted);padding:7px 11px;border-radius:20px;font-size:11px}.lane-tabs button.active{border-color:var(--cyan);color:var(--cyan)}.lane-content{border-top:1px solid var(--line);padding-top:12px;color:var(--muted);line-height:1.6}.error{color:#ff5c7a}@media(max-width:700px){#app{padding:0 12px 30px}.topbar{height:80px}.brand{font-size:19px}.nav{gap:12px}.header-right .updated{display:none}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.value{font-size:18px}.table{font-size:10px}}
</style><style>.research-heading{margin:0 0 14px}.research-heading h1{font:700 18px Orbitron,sans-serif;letter-spacing:1.5px;color:var(--cyan);margin:0}.research-heading p{color:var(--muted);font-size:12px;margin:6px 0 0}.lane-facts{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;color:var(--muted);font-size:12px}.lane-facts strong{color:var(--text)}</style></head><body>
<div id="login"><h1>AUTOBOT</h1><div class="muted">Secure dashboard access</div><input type="password" id="code" maxlength="6" placeholder="••••••"><button class="button" onclick="doLogin()">ACCESS</button><span id="login-error" class="error"></span></div>
<div id="app"><header class="topbar"><a class="brand" href="/" aria-label="Autobot home">AUTOBOT</a><nav class="nav" aria-label="Primary"><a href="/research" data-route="research">Research</a><a href="/trading" data-route="trading">Trading</a></nav><div class="header-right"><span class="muted updated" id="updated"></span><button class="button" id="refresh" onclick="loadRoute()">REFRESH</button></div></header><main id="view"></main></div>
<script>
const BASE='__AUTOBOT_BASE_PATH__',KEY='autobot_token';let TOKEN=localStorage.getItem(KEY),route='research',research=null,trading=null,requestGeneration=0,activeRequest=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,options={}){const requestToken=TOKEN;const r=await fetch(BASE+path,{...options,headers:{'Content-Type':'application/json',...(requestToken?{Authorization:'Bearer '+requestToken}:{}),...(options.headers||{})}});if(r.status===401&&TOKEN===requestToken){localStorage.removeItem(KEY);TOKEN=null;document.getElementById('app').style.display='none';document.getElementById('login').style.display='flex';}return r}
async function doLogin(){const r=await api('/api/auth',{method:'POST',body:JSON.stringify({code:document.getElementById('code').value})});if(!r.ok){document.getElementById('login-error').textContent='Access denied';return}TOKEN=(await r.json()).token;localStorage.setItem(KEY,TOKEN);showApp();loadRoute()}
document.getElementById('code').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
function showApp(){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block'}
function currentRoute(){return location.pathname.endsWith('/trading')?'trading':'research'}
function navigate(next){const url=BASE+(next==='trading'?'/trading':'/research');history.pushState({},'',url);loadRoute(next)}
document.querySelector('.brand').href=BASE+'/';document.querySelectorAll('.nav a').forEach(a=>a.href=BASE+'/'+a.dataset.route);
document.querySelectorAll('.nav a').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();navigate(a.dataset.route)}));window.addEventListener('popstate',()=>{route=currentRoute();loadRoute()});
const money=v=>v==null?'—':Number(v).toLocaleString('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0});
const pct=v=>v==null?'—':(Number(v)*100).toFixed(2)+'%';const ratio=v=>v==null?'—':Number(v).toFixed(2);
const equityNumber=value=>{if(typeof value==='number')return Number.isFinite(value)&&value>0?value:null;if(typeof value!=='string'||! /^[+-]?(?:[0-9]+(?:\.[0-9]*)?|\.[0-9]+)(?:[eE][+-]?[0-9]+)?(?![\s\S])/.test(value))return null;const number=Number(value);return Number.isFinite(number)&&number>0?number:null};
function chart(data){
 if(data?.availability!=='available'||!data.points?.length)return '<div class="empty">Verified champion development-history curve unavailable.</div>';
 const points=data.points,equities=points.map(point=>equityNumber(point.equity)),valid=equities.map(value=>value!==null);
 const marks=equities.filter(value=>value!==null);
 if(marks.length<2)return '<div class="empty">Verified champion development-history curve unavailable.</div>';
 const w=960,h=250,left=78,right=18,top=16,bottom=36,plotH=h-top-bottom,lo=Math.min(...marks),hi=Math.max(...marks),span=hi-lo||Math.max(Math.abs(hi)*.02,1),low=lo-span*.05,high=hi+span*.05,range=high-low;
 const x=i=>left+i/(points.length-1)*(w-left-right),y=value=>top+(high-value)/range*plotH;
 const grid=Array.from({length:5},(_,i)=>{const value=high-i*range/4,yy=y(value);return `<line x1="${left}" y1="${yy}" x2="${w-right}" y2="${yy}" stroke="#22293a"/><text x="${left-8}" y="${yy+4}" text-anchor="end" fill="#92a1b8" font-size="11">${esc(money(value))}</text>`}).join('');
 const segments=[];let segment=[];points.forEach((point,i)=>{if(valid[i])segment.push(`${x(i)},${y(equities[i])}`);else if(segment.length){segments.push(segment);segment=[]}});if(segment.length)segments.push(segment);
 const paths=segments.filter(segment=>segment.length>1).map(segment=>`<polyline fill="none" stroke="#00f0ff" stroke-width="2" points="${segment.join(' ')}"/>`).join('');
 const gapText=data.gap_count?`${data.gap_count} missing mark${data.gap_count===1?'':'s'} shown as gaps; no data is invented or smoothed.`:'No missing marks.';
  return `<div class="objective">Verified development history · ${esc(data.development_start)} through ${esc(data.development_end)}. Starting equity comes from the first verified numeric mark; ending equity: ${esc(money(data.ending_equity))}. ${esc(gapText)} The full-history in-sample Annual return, Sharpe, and maximum drawdown metrics summarize this development window through the cutoff. Objective score is separate and uses ${esc(data.score_label)}.</div><div class="chart"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Verified development-history champion equity with gaps at missing marks">${grid}${paths}<text x="${left}" y="${h-8}" fill="#92a1b8" font-size="11">${esc(points[0].date)}</text><text x="${w-right}" y="${h-8}" text-anchor="end" fill="#92a1b8" font-size="11">${esc(points[points.length-1].date)}</text></svg></div>`
}
const LANE_STAGES=[['historical','Historical'],['modeled','Modeled'],['paper','Paper'],['trivial_capital','Trivial Capital'],['live','Live']];let laneStageSelection={};
function renderLaneStage(lane,stage){if(stage==='modeled'&&[lane.last_run_ts,lane.current_asset,lane.target_asset,lane.decision_reason].some(value=>value!=null))return `<div class="lane-content"><div><strong>Last runtime:</strong> ${esc(lane.last_run_ts??'—')}</div><div><strong>Current asset:</strong> ${esc(lane.current_asset??'—')}</div><div><strong>Target asset:</strong> ${esc(lane.target_asset??'—')}</div><div><strong>Decision reason:</strong> ${esc(lane.decision_reason??'—')}</div></div>`;return '<div class="lane-content">No verified data for this stage</div>'}
function renderLane(lane,index){const selected=laneStageSelection[lane.lane_id]||'historical';return `<article class="card"><h2>${esc(lane.display_name)}</h2><div class="meta">${esc(lane.lane_id)}</div><div class="lane-facts"><span><strong>Modeled configured:</strong> ${lane.modeled_enabled?'Yes':'No'}</span><span><strong>Paper configured:</strong> ${lane.paper_enabled?'Yes':'No'}</span><span><strong>Live configured:</strong> ${lane.live_enabled?'Yes':'No'}</span></div><div class="objective">Configuration is not evidence of stage activity or performance.</div><div class="lane-tabs" role="tablist" aria-label="${esc(lane.display_name)} lifecycle">${LANE_STAGES.map(([key,label])=>`<button type="button" role="tab" aria-selected="${selected===key}" class="${selected===key?'active':''}" onclick="selectLaneStage(${index},'${key}')">${label}</button>`).join('')}</div>${renderLaneStage(lane,selected)}</article>`}
function renderTrading(data){if(!data.lanes?.length)return '<article class="card empty"><h2>No promoted strategy lanes</h2><p>There are currently no canonical promoted lanes.</p></article>';return data.lanes.map(renderLane).join('')}
function selectLaneStage(index,stage){const lane=trading?.lanes?.[index];if(!lane||!LANE_STAGES.some(([key])=>key===stage))return;laneStageSelection[lane.lane_id]=stage;document.getElementById('view').innerHTML=renderTrading(trading)}
async function loadRoute(target=currentRoute()){if(!TOKEN)return;route=target==='trading'?'trading':'research';const requestRoute=route,generation=++requestGeneration;if(activeRequest)activeRequest.abort();const controller=new AbortController();activeRequest=controller;const refresh=document.getElementById('refresh');refresh.disabled=true;document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('active',a.dataset.route===requestRoute));try{const endpoint=requestRoute==='trading'?'/api/dashboard/trading':'/api/dashboard/research';const response=await api(endpoint,{signal:controller.signal});if(generation!==requestGeneration)return;if(!response.ok)throw Error(`Request failed (${response.status})`);const data=await response.json();if(generation!==requestGeneration)return;if(requestRoute==='trading'){trading=data;document.getElementById('view').innerHTML=renderTrading(data)}else{research=data;document.getElementById('view').innerHTML=renderResearch(data)}}catch(e){if(generation===requestGeneration&&e.name!=='AbortError')document.getElementById('view').innerHTML=`<article class="card empty error">Dashboard unavailable: ${esc(e.message)}</article>`}finally{if(generation===requestGeneration){activeRequest=null;refresh.disabled=false}}}
if(TOKEN){showApp();route=currentRoute();loadRoute(route)}setInterval(()=>{if(TOKEN)loadRoute(currentRoute())},120000);
function renderResearch(data){const c=data.champion,n=data.counts||{},a=data.activity||{},recent=Array.isArray(data.recent)?data.recent:[],state=(a.state||'unknown').toUpperCase();const rows=recent.length?recent.map(r=>`<tr><td>${esc(r.experiment_id)}</td><td>${esc(r.status)}</td><td>${esc(pct(r.score))}</td><td>${esc(pct(r.development_annual_return))}</td></tr>`).join(''):'<tr><td colspan="4" class="empty">No verified recent experiments.</td></tr>';return `<section class="research-heading"><h1>Research</h1><p>Growth strategy discovery · development-window evidence</p></section><section class="tiles"><div class="tile"><div class="label">System</div><div class="value ${a.state==='active'?'green':''}">${esc(state)}</div><div class="objective">Runner heartbeat${a.heartbeat?' · '+esc(a.heartbeat):' unavailable or stale'}</div></div><div class="tile"><div class="label">Objective</div><div class="value cyan">EXCESS Annual return</div><div class="objective">${esc(data.score_label)}</div></div><div class="tile"><div class="label">Best Score</div><div class="value green">${c?esc(pct(c.score)):'—'}</div><div class="objective">Excess Annual return · ${esc(data.score_label)}</div></div><div class="tile"><div class="label">Experiments</div><div class="value">${esc(n.valid_attempts??0)}</div><div class="objective">${esc(n.scored??0)} scored · ${esc(n.distinct_candidates??0)} distinct identities</div></div></section>${c?`<article class="card"><div class="champ-head"><div><h2>Current champion</h2><div class="meta">${esc(c.experiment_id)} · SHA-256 ${esc(String(c.candidate_sha??"").slice(0,12))} · evaluator ${esc(c.evaluator_version)}</div></div><div class="value green">${esc(pct(c.score))}</div></div><div class="objective">${esc(c.objective)} · ${esc(c.objective_sentence)}</div><div class="metrics"><span><strong>Full-history in-sample Annual return</strong> ${esc(pct(c.annual_return))}</span><span><strong>Full-history in-sample Sharpe</strong> ${esc(ratio(c.sharpe))}</span><span><strong>Full-history in-sample max drawdown</strong> ${esc(pct(c.max_drawdown))}</span><span><strong>Starting equity</strong> ${esc(money(c.starting_equity))}</span><span><strong>Ending equity</strong> ${esc(money(c.ending_equity))}</span><span><strong>Curve window</strong> ${esc(c.development_start)} – ${esc(c.development_end)}</span></div><details class="objective"><summary>Evidence identity</summary><div>Candidate SHA-256: <code>${esc(c.candidate_sha256)}</code><br>Dataset manifest SHA-256: <code>${esc(c.dataset_manifest_sha256)}</code><br>Evaluator version: <code>${esc(c.evaluator_version)}</code></div></details>${chart({...data.chart,score_label:data.score_label})}</article>`:'<article class="card empty">No consistent pinned champion is currently available.</article>'}<article class="card"><h2>Recent experiments</h2><div class="objective">Current evaluator, manifest and contract only · development metrics</div><table class="table"><thead><tr><th>Experiment</th><th>Status</th><th>Score</th><th>Development Annual return</th></tr></thead><tbody>${rows}</tbody></table></article>`}
</script></body></html>
